<style>
/* Layout: one full-screen night river canvas; floating glass controls on top; a bottom sheet for making a krathong. Single committed night look. */
:root{
  --night:#070b24;
  --ink:#f6efe0;
  --ink-dim:#b9b4c9;
  --gold:#ffc861;
  --gold-deep:#e59a2b;
  --lotus:#ff7fa9;
  --leaf:#5aa64a;
  --glass:rgba(14,18,48,.72);
  --glass-line:rgba(255,214,140,.22);
  --f-display:"Srisakdi","Charm",serif;
  --f-body:"Bai Jamjuree","Sarabun","Noto Sans Thai",system-ui,sans-serif;
  --f-wish:"Charm","Srisakdi",serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#river{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none;background:linear-gradient(180deg,rgba(5,7,26,.75),rgba(5,7,26,0))}
.top>*{pointer-events:auto}
.brand h1{margin:0;font-family:var(--f-display);font-size:clamp(26px,5vw,40px);line-height:1;color:var(--gold);text-shadow:0 0 18px rgba(255,190,90,.55)}
.brand p{margin:4px 0 0;font-size:13px;color:var(--ink-dim);letter-spacing:.02em}
.brand .count{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tool{background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:inline-flex;align-items:center;gap:6px;transition:background .2s,border-color .2s}
.tool:hover{border-color:var(--gold)}
.tool[aria-pressed="true"]{background:rgba(255,200,97,.2);border-color:var(--gold);color:var(--gold)}
.tool svg{width:15px;height:15px}

.scenes{position:fixed;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scene-row{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;padding:4px;background:rgba(6,9,30,.55);border-radius:999px;border:1px solid rgba(255,255,255,.08);max-width:100%;scrollbar-width:none}
.scene-row::-webkit-scrollbar{display:none}
.scene-chip{flex:none;border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-dim);white-space:nowrap}
.scene-chip.magic{color:#a9f0ff}
.scene-chip.magic[aria-pressed="true"]{background:linear-gradient(90deg,#9ff3ff,#d9b6ff);color:#1b0b45}
.scene-chip[aria-pressed="true"]{background:var(--ink);color:#1b1640;font-weight:700}

.cta-wrap{position:fixed;z-index:5;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:center;gap:10px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cta{pointer-events:auto;border:0;border-radius:999px;padding:14px 30px;font-size:18px;font-weight:700;color:#2a1600;background:radial-gradient(circle at 30% 20%,#fff1c4,var(--gold) 45%,var(--gold-deep));box-shadow:0 0 0 4px rgba(255,200,97,.18),0 8px 30px rgba(255,170,60,.45);animation:breathe 3.2s ease-in-out infinite}
.cta-sub{pointer-events:auto;border-radius:999px;padding:14px 18px;font-size:15px;font-weight:600}
@keyframes breathe{50%{box-shadow:0 0 0 9px rgba(255,200,97,.08),0 8px 40px rgba(255,170,60,.65)}}

.status{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);font-size:12px;color:var(--ink-dim);text-align:center;width:min(92vw,520px);pointer-events:none;text-shadow:0 1px 4px #000}
.empty{position:fixed;z-index:3;left:50%;top:58%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:min(88vw,420px)}
.empty b{display:block;font-family:var(--f-wish);font-size:26px;color:var(--gold);margin-bottom:4px}
.empty span{font-size:14px;color:var(--ink-dim)}

/* sheet */
.veil{position:fixed;inset:0;z-index:10;background:rgba(3,4,18,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{overflow-x:hidden;position:fixed;z-index:11;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,600px);max-height:92%;overflow-y:auto;background:linear-gradient(180deg,#171a46,#0d0f2c);border:1px solid var(--glass-line);border-bottom:0;border-radius:24px 24px 0 0;padding-block:18px calc(env(safe-area-inset-bottom,0px) + 22px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:rise .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rise{from{transform:translate(-50%,40px);opacity:0}}
.sheet h2{margin:0;font-family:var(--f-display);color:var(--gold);font-size:30px;line-height:1.1}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{background:transparent;border:1px solid rgba(255,255,255,.15);border-radius:50%;width:36px;height:36px;font-size:18px;flex:none}
.preview{display:block;width:100%;height:190px;margin:8px 0 4px;border-radius:16px;background:radial-gradient(ellipse at 50% 120%,#1f3a6e,#0b1030 70%)}
.step{margin-top:16px}
.step-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.type{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:14px;padding:6px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.type canvas{width:100%;height:64px}
.type b{font-size:14px}
.type small{font-size:11px;color:var(--ink-dim);line-height:1.3}
.type[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,200,97,.12);box-shadow:0 0 0 1px var(--gold) inset}
.field{display:flex;flex-direction:column;gap:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
label.l{font-size:13px;color:var(--ink-dim)}
input[type=text],textarea{width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 13px;font:inherit;font-size:16px;color:var(--ink)}
textarea{font-family:var(--f-wish);font-size:20px;line-height:1.45;min-height:88px;resize:vertical}
input::placeholder,textarea::placeholder{color:#8a86a3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid rgba(255,255,255,.16);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--lotus);border-color:var(--lotus);color:#2b0716;font-weight:700}
.swatches{display:flex;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px rgba(255,255,255,.15),0 0 14px currentColor}
.go{margin-top:20px;width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:700;color:#2a1600;background:linear-gradient(180deg,#ffe2a0,var(--gold) 50%,var(--gold-deep))}
.go:disabled{opacity:.45}
.err{color:#ff9d9d;font-size:13px;min-height:1em;margin-top:8px}
.counter{font-variant-numeric:tabular-nums}

/* cards */
.card{position:fixed;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);max-height:86%;overflow-y:auto;box-sizing:border-box;background:linear-gradient(170deg,#211b52,#0f1131 70%);border:1px solid var(--glass-line);border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(255,190,90,.12);animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.94);opacity:0}}
.card .kind{font-size:12px;color:var(--gold);letter-spacing:.08em;font-weight:700}
.card h3{margin:6px 0 2px;font-size:22px;line-height:1.25;text-wrap:balance}
.card .who2{color:var(--lotus);font-weight:600}
.card .wish{font-family:var(--f-wish);font-size:24px;line-height:1.5;margin:14px 0;color:#fff6df;white-space:pre-wrap;overflow-wrap:anywhere}
.card .meta{font-size:12px;color:var(--ink-dim)}
.card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.btn.primary{background:var(--gold);color:#2a1600;border-color:var(--gold)}
.btn.danger{border-color:#ff8f8f;color:#ffb3b3}
.siam-no{margin-top:14px;font-family:var(--f-display);font-size:54px;color:var(--gold);line-height:1;text-shadow:0 0 20px rgba(255,190,90,.5)}
.siam-level{display:inline-block;background:var(--lotus);color:#2b0716;font-weight:700;border-radius:999px;padding:3px 10px;font-size:12px;margin-top:6px}
.siam-text{font-size:18px;line-height:1.6;margin:12px 0 0}

/* list drawer */
.drawer{position:fixed;z-index:9;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 92px);width:min(86vw,320px);max-height:52%;overflow-y:auto;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-line);border-radius:18px;padding:12px}
.drawer h4{margin:2px 4px 8px;font-size:14px;color:var(--gold)}
.tabs{display:flex;gap:4px;margin-bottom:8px;background:rgba(255,255,255,.06);border-radius:10px;padding:3px}
.tab{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 4px;font-size:12px;font-weight:600;color:var(--ink-dim)}
.tab.on{background:var(--gold);color:#2a1600}
.feed-row{border-top:1px solid rgba(255,255,255,.07);padding:9px 6px}
.feed-row b{display:block;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.feed-row small{font-size:11px;color:var(--ink-dim)}
.ticker{position:fixed;z-index:7;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translate(-50%,-14px);opacity:0;max-width:min(92vw,560px);border:1px solid rgba(255,140,170,.5);background:linear-gradient(90deg,rgba(60,14,40,.92),rgba(20,16,60,.92));color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 24px rgba(255,120,170,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.ticker.in{transform:translate(-50%,0);opacity:1}
.ticker.out{transform:translate(-50%,-14px);opacity:0}
body.in-battle .ticker{display:none!important}
.li{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid rgba(255,255,255,.07);padding:9px 6px}
.li b{display:block;font-size:14px;overflow-wrap:anywhere}
.li span{display:block;font-family:var(--f-wish);font-size:16px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.mine b::after{content:" · ของคุณ";color:var(--gold);font-weight:600;font-size:12px}

.toast{position:fixed;z-index:20;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);background:rgba(255,246,223,.95);color:#2a1a3a;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:88vw;text-align:center;animation:pop2 .25s ease-out}
@keyframes pop2{from{opacity:0;transform:translate(-50%,-8px)}}
@media (prefers-reduced-motion:reduce){.cta{animation:none}.sheet,.card,.toast{animation:none}}

.photo-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.crop{width:160px;height:160px;border-radius:50%;overflow:hidden;flex:none;position:relative;box-shadow:0 0 0 4px #e7b24a,0 0 0 7px rgba(255,220,150,.25),0 8px 24px rgba(0,0,0,.4);background:rgba(255,255,255,.04)}
.crop canvas{width:160px;height:160px;display:block;cursor:pointer;touch-action:none}
.crop.has canvas{cursor:grab}
.photo-ctl{display:flex;flex-direction:column;gap:8px;flex:1 1 150px;min-width:0}
.photo-ctl input[type=range]{width:100%;accent-color:var(--gold)}
.photo-ctl input[type=range]:disabled{opacity:.35}
.file-btn{text-align:center;cursor:pointer;display:block}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.hint{font-size:12px;color:var(--ink-dim);line-height:1.4}
.card-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.kphoto{width:86px;height:86px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 3px #e7b24a,0 0 0 6px rgba(255,220,150,.22)}
.btn.ghost{background:transparent;color:var(--ink-dim);border-color:rgba(255,255,255,.12)}
.li{display:flex!important;gap:10px;align-items:center}
.li-text{min-width:0;flex:1}
.li-photo{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px #e7b24a}
.siam-no{margin-top:14px}

body.in-battle .scenes, body.in-battle .cta-wrap, body.in-battle .status, body.in-battle .empty, body.in-battle .drawer{display:none!important}
.bhud{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);width:min(92vw,420px);background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:10px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bh-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.bh-row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bh-row span{color:var(--ink-dim);flex:none;margin-left:auto}
.bh-exit{flex:none;border:1px solid rgba(255,255,255,.2);background:transparent;border-radius:8px;padding:1px 8px;font-size:11px}
.bar{position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:7px;transition:width .15s}
.bar.hp i{background:linear-gradient(90deg,#ff5f6d,#ffc371 60%,#7cf29a)}
.bar.sp i{background:linear-gradient(90deg,#6a7cff,#9ff3ff)}
.bar span{position:absolute;inset:0;font-size:10px;font-weight:700;line-height:14px;text-align:center;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.bskills{position:fixed;z-index:6;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;justify-content:center;flex-wrap:nowrap;pointer-events:none}
.sk{pointer-events:auto;position:relative;overflow:hidden;width:min(calc((100vw - 44px - (var(--nsk,2) - 2)*8px)/var(--nsk,2)),170px);min-height:70px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(14,18,48,.85);padding:6px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sk b{font-size:14px;line-height:1.2}
.sk small{font-size:10px;color:var(--ink-dim)}
.sk .key{position:absolute;top:3px;left:6px;font-size:10px;color:var(--ink-dim)}
.sk.sig{border-color:var(--gold);background:linear-gradient(180deg,rgba(80,58,10,.85),rgba(14,18,48,.85))}
.sk.ready{box-shadow:0 0 0 1px var(--gold) inset,0 0 18px rgba(255,200,97,.35)}
.sk:disabled{opacity:.45}
.sk-exit{pointer-events:auto;align-self:center;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(14,18,48,.85);padding:10px 12px;font-size:12px}
.pick{display:grid;gap:8px;margin-top:12px}
.pick button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:12px;padding:10px}
.pick button:hover{border-color:var(--gold)}
.pick b{display:block;font-size:14px}
.pick small{display:block;font-size:11px;color:var(--ink-dim)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stats div{background:rgba(255,255,255,.06);border-radius:10px;padding:6px;text-align:center;font-size:11px;color:var(--ink-dim)}
.stats b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.sticks{display:grid;gap:8px;margin-top:10px}
.stick{border:1px solid rgba(255,200,97,.35);background:linear-gradient(90deg,rgba(255,200,97,.12),rgba(255,255,255,.03));border-radius:12px;padding:8px 10px;animation:pop .35s both}
.stick b{color:var(--gold)}
.stick p{margin:2px 0 0;font-size:12px;color:var(--ink-dim)}
.shake{display:inline-block;animation:shake .5s ease-in-out 3}
@keyframes shake{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}

.myk{display:flex;flex-direction:column;gap:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:12px;padding:10px}
.myk b{display:block;font-size:14px}
.myk small{display:block;font-size:11px;color:var(--ink-dim);margin-top:2px}
.myk-acts{display:flex;gap:6px;flex-wrap:wrap}
.myk-acts .btn{padding:7px 10px;font-size:13px}
.coins{display:inline-block;margin:6px 0 2px;padding:4px 12px;border-radius:999px;background:rgba(255,200,97,.15);color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.uplist{display:grid;gap:6px;margin:8px 0}
.uprow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px}
.uprow b{display:block;font-size:14px}
.uprow small{display:block;font-size:11px;color:var(--ink-dim)}
.uprow .btn{padding:7px 12px;font-size:13px;flex:none}
.vs{text-align:center;font-family:var(--f-display);font-size:30px;color:var(--lotus);margin:6px 0}
.board{display:grid;gap:6px;margin-top:10px}
.brow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px}
.brow.mine{box-shadow:0 0 0 1px var(--gold) inset}
.brow.new{box-shadow:0 0 0 1px var(--lotus) inset}
.brow b{display:block;font-size:13px;overflow-wrap:anywhere}
.brow small{display:block;font-size:11px;color:var(--ink-dim)}
.brow>div{flex:1}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,200,97,.18);color:var(--gold);font-weight:700;font-size:12px;flex:none}
.kills{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
#btnBattle{position:relative}
#btnBattle.has-news::after{content:"";position:absolute;top:2px;right:4px;width:9px;height:9px;border-radius:50%;background:#ff5f6d;box-shadow:0 0 0 2px var(--night)}

.sk{border-color:color-mix(in srgb,var(--skc,#fff) 45%,transparent)}
.sk>*{position:relative;z-index:1}
.sk .sk-fill{position:absolute;z-index:0;left:0;bottom:0;top:0;width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--skc,#fff) 10%,transparent),color-mix(in srgb,var(--skc,#fff) 34%,transparent));transition:width .2s}
.sk.ready{box-shadow:0 0 0 1px var(--skc,var(--gold)) inset,0 0 22px color-mix(in srgb,var(--skc,#ffc861) 55%,transparent);animation:skpulse 1.2s ease-in-out infinite}
.sk.ready b{color:#fff;text-shadow:0 0 10px var(--skc,#ffc861)}
.sk:disabled{opacity:.7}
@keyframes skpulse{50%{box-shadow:0 0 0 1px var(--skc,var(--gold)) inset,0 0 34px color-mix(in srgb,var(--skc,#ffc861) 75%,transparent)}}
@media (prefers-reduced-motion:reduce){.sk.ready{animation:none}}

.ascend{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:8px 0;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,200,97,.4);background:linear-gradient(90deg,rgba(255,200,97,.14),rgba(255,140,200,.08))}
.ascend b{color:var(--gold);font-size:14px}
.ascend small{grid-column:1;font-size:11px;color:var(--ink-dim)}
.ascend .btn{grid-row:1/3;grid-column:2;padding:8px 12px;font-size:13px}
.devfab{position:fixed;left:12px;bottom:12px;z-index:60;background:#1b0d2e;color:#9effc8;border:1px solid #4dff9e;border-radius:10px;padding:6px 10px;font:700 12px monospace;cursor:pointer;box-shadow:0 0 12px rgba(77,255,158,.35)}
body.in-battle .devfab,.devfab[hidden],.devbar[hidden]{display:none!important}
.devbar{position:fixed;left:6px;top:36%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:4px;align-items:stretch;background:rgba(20,8,40,.7);border:1px solid #4dff9e88;border-radius:10px;padding:4px;font:10px monospace;color:#9effc8;opacity:.75}
.devbar:hover{opacity:1}
.devbar b{text-align:center}
.devbar button{white-space:nowrap;background:#2a1450;color:#e8fff2;border:1px solid #4dff9e66;border-radius:7px;padding:3px 6px;font:600 11px "Bai Jamjuree",sans-serif;cursor:pointer}
.devbar select{background:#2a1450;color:#e8fff2;border:1px solid #4dff9e66;border-radius:7px;font:600 11px "Bai Jamjuree",sans-serif;max-width:110px}
.devbar button.on{background:#4dff9e;color:#08200f}
.dev-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.dev-grid .btn{padding:8px 0}
.dev-sel{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.dev-sel .btn{padding:6px 10px;font-size:13px}
.dev-sel .btn.on{background:#4dff9e;color:#08200f;border-color:#4dff9e}
.relic-slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.rslot{display:flex;gap:8px;align-items:center;padding:8px;border-radius:12px;border:1px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.04);min-height:58px}
.rslot.full{border-style:solid}
.rslot img,.ritem img{width:44px;height:44px;image-rendering:pixelated;flex:none}
.rslot b,.ritem b{font-size:13px;display:block}
.rslot small,.ritem small{font-size:11px;color:var(--ink-dim);display:block;line-height:1.35}
.rgrid{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0;max-height:46vh;overflow:auto}
.ritem{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid rgba(var(--rc),.55);background:linear-gradient(90deg,rgba(var(--rc),.16),rgba(var(--rc),.03))}
.ritem.locked{opacity:.45;filter:grayscale(1)}
.ritem .btn{margin-left:auto;padding:6px 10px;font-size:12px}
.rar{display:inline-block;font:800 10px/1 monospace;padding:3px 5px;border-radius:5px;margin-right:4px;background:rgba(var(--rc),.9);color:#140a00}
.gacha-acts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.gacha-reveal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.gcard{width:104px;padding:10px 6px;border-radius:14px;text-align:center;border:2px solid rgba(var(--rc),.9);background:radial-gradient(circle at 50% 35%,rgba(var(--rc),.45),rgba(10,6,24,.95) 70%);animation:gpop .5s cubic-bezier(.2,1.6,.4,1) both;position:relative;overflow:hidden}
.gcard img{width:64px;height:64px;image-rendering:pixelated;filter:drop-shadow(0 0 10px rgba(var(--rc),.9))}
.gcard b{display:block;font-size:12px;margin-top:4px}
.gcard small{display:block;font-size:10px;color:#ffe9b0}
.gcard.ur::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,rgba(255,210,120,.5),transparent 30%,rgba(255,120,80,.4),transparent 60%);animation:gspin 2.4s linear infinite}
.gcard.ur>*{position:relative}
@keyframes gpop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes gspin{to{transform:rotate(360deg)}}
.cls-box{border-color:rgba(170,200,255,.45);background:linear-gradient(90deg,rgba(140,180,255,.14),rgba(200,140,255,.08))}
.cls-box b{color:#bcd4ff}
.tut-ic{font-size:44px;line-height:1;text-align:center;margin:6px 0 2px;filter:drop-shadow(0 0 14px rgba(255,200,97,.55))}
.tut-tx{font-size:15px;line-height:1.6;color:var(--ink);margin:6px 0 10px}
.tut-dots{display:flex;gap:6px;justify-content:center;margin:4px 0 10px}
.tut-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer}
.tut-dots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.myk small.goal{color:#ffd88a;font-weight:600}
.btn.glow{animation:btnGlow 1.4s ease-in-out infinite}

.btn.dun{background:linear-gradient(180deg,#5a1020,#2a0614);border-color:#c0304a;color:#ffd0d6}
.dun-floors{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0}
.dun-floors i{height:10px;border-radius:3px;background:rgba(255,255,255,.12)}

.dun-floors i.boss{outline:1px solid #ffb04a}
.pick button.on{border-color:var(--gold);background:rgba(255,200,97,.12)}

<canvas id="river" aria-label="แม่น้ำยามค่ำคืน แตะกระทงเพื่ออ่านคำอธิษฐาน แตะท้องฟ้าเพื่อปล่อยโคมลอย"></canvas>

<header class="top">

    <h1>ลอยกระทงออนไลน์</h1>

  <div class="tools">
    <button class="tool" id="btnSound" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>เสียง</button>
    <button class="tool" id="btnFire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg>จุดพลุ</button>

    <button class="tool" id="btnBattle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 17.5 21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4M5 21l-2-2"/></svg>ศึกกระทง</button>
    <button class="tool" id="btnList" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>บอร์ด</button>

</header>

<div class="empty" id="empty" hidden><b>แม่น้ำยังว่างอยู่</b><span>กด “ลอยกระทง” แล้วเป็นคนแรกที่ส่งคำอธิษฐานลงน้ำคืนนี้</span></div>
<div class="status" id="status" hidden></div>

<nav class="scenes" aria-label="เลือกแม่น้ำ"><div class="scene-row" id="sceneRow"></div></nav>

<div class="cta-wrap"><button class="cta" id="btnOpen">ลอยกระทง</button></div>

<div class="veil" id="veil" hidden></div>

<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><h2 id="sheetTitle">ทำกระทงของคุณ</h2><button class="x" id="btnClose" aria-label="ปิด">✕</button></div>
  <canvas class="preview" id="preview" aria-hidden="true"></canvas>

  <div class="step"><div class="step-label"><span>1 · เลือกกระทง</span></div><div class="types" id="types"></div></div>

  <div class="step row2">
    <div class="field"><label class="l" for="inName">ชื่อคุณ</label><input type="text" id="inName" maxlength="30" placeholder="ชื่อเล่นของคุณ" autocomplete="nickname"></div>

  </div>

    <div class="chips" id="cats" style="margin-top:6px"></div>
  </div>

        <input type="range" id="zoom" min="1" max="4" step="0.01" value="1">
        <button class="btn" type="button" id="btnNoPhoto" hidden>เอารูปออก</button>
        <small id="cropHint" class="hint"></small>
      </div>
    </div>
  </div>

  <div class="err" id="err" role="alert"></div>
  <button class="go" id="btnGo">อธิษฐานแล้ว ลอยเลย</button>
</section>

<section class="card" id="card" hidden role="dialog" aria-modal="true"></section>

const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.random()*(b-a);
const frac = v => v - Math.floor(v);
const TAU = Math.PI*2;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function mulberry(seed){ let a = seed>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function toast(msg){ const old = document.querySelector(".toast"); if(old) old.remove(); const t = document.createElement("div"); t.className="toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3200); }
function ago(ms){ const m = Math.max(0, Math.round((Date.now()-ms)/60000)); if(m<1) return "เมื่อสักครู่"; if(m<60) return m+" นาทีที่แล้ว"; const h=Math.round(m/60); if(h<24) return h+" ชั่วโมงที่แล้ว"; return Math.round(h/24)+" วันที่แล้ว"; }
function clean(v, max){ return (typeof v === "string" ? v : "").slice(0, max); }
function lg(c,x0,y0,x1,y1,stops){ const g=c.createLinearGradient(x0,y0,x1,y1); for(const [o,col] of stops) g.addColorStop(o,col); return g; }
function rg(c,x,y,r0,r1,stops,x1,y1){ const g=c.createRadialGradient(x,y,r0,x1??x,y1??y,r1); for(const [o,col] of stops) g.addColorStop(o,col); return g; }

/* image cache for krathong photos */
const imgCache = new Map();
function getImg(url){
  if(!url) return null;
  let e = imgCache.get(url);
  if(!e){ const im = new Image(); im.decoding = "async"; e = {im, ok:false}; im.onload = () => { e.ok = true; }; im.src = url; imgCache.set(url, e); }
  return e.ok ? e.im : null;
}

/* ================= krathong drawing ================= */
function petal(c,bx,by,tx,ty,w,base,tip,edge,vein){
  const dx=tx-bx, dy=ty-by, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
  c.beginPath();
  c.moveTo(bx+nx*w, by+ny*w);
  c.quadraticCurveTo(bx+dx*.5+nx*w*1.2, by+dy*.5+ny*w*1.2, tx, ty);
  c.quadraticCurveTo(bx+dx*.5-nx*w*1.2, by+dy*.5-ny*w*1.2, bx-nx*w, by-ny*w);
  c.closePath();
  c.fillStyle = tip ? lg(c,bx,by,tx,ty,[[0,base],[1,tip]]) : base;
  c.fill();
  if(edge){ c.strokeStyle=edge; c.lineWidth=Math.max(.5,w*.1); c.stroke(); }
  if(vein){ c.strokeStyle=vein; c.lineWidth=Math.max(.35,w*.07); c.beginPath(); c.moveTo(bx,by); c.lineTo(bx+dx*.82,by+dy*.82); c.stroke(); }
}
function ring(c,s,o,front){
  const items=[];
  for(let i=0;i<o.n;i++){ const a=(i/o.n)*TAU+(o.off||0); items.push({a,i,sn:Math.sin(a)}); }
  items.sort((p,q)=>p.sn-q.sn);
  for(const it of items){
    if(front ? it.sn<0 : it.sn>=0) continue;
    const ca=Math.cos(it.a), sa=it.sn, y0=(o.y||0)*s;
    const bx=ca*o.rx*s, by=sa*o.ry*s+y0;
    const tx=ca*o.rx*o.out*s, ty=sa*o.ry*o.out*s-o.up*s+y0;
    const [b,t]=o.col(it.i,sa);
    petal(c,bx,by,tx,ty,o.w*s,b,t,o.edge,o.vein);
  }
}
function marigold(c,x,y,r,c1,c2){
  for(let layer=0;layer<3;layer++){
    const rr=r*(1-layer*.27); c.fillStyle = layer===1 ? c2 : c1;
    const n=11-layer*3;
    for(let i=0;i<n;i++){ const a=i/n*TAU+layer*.35; c.beginPath(); c.ellipse(x+Math.cos(a)*rr*.5,y+Math.sin(a)*rr*.38,rr*.34,rr*.26,a,0,TAU); c.fill(); }
  }
  c.fillStyle="rgba(110,40,0,.55)"; c.beginPath(); c.arc(x,y,r*.14,0,TAU); c.fill();
}
function jasmine(c,x,y,r){
  c.fillStyle="#fffdf6";
  for(let i=0;i<5;i++){ const a=i/5*TAU-Math.PI/2; c.beginPath(); c.ellipse(x+Math.cos(a)*r*.48,y+Math.sin(a)*r*.36,r*.36,r*.2,a,0,TAU); c.fill(); }
  c.fillStyle="#f1dc6a"; c.beginPath(); c.arc(x,y,r*.13,0,TAU); c.fill();
}
function rose(c,x,y,r,col,dark){
  c.fillStyle=rg(c,x-r*.3,y-r*.3,0,r*1.1,[[0,col],[1,dark]]); c.beginPath(); c.ellipse(x,y,r,r*.82,0,0,TAU); c.fill();
  c.strokeStyle="rgba(0,0,0,.22)"; c.lineWidth=Math.max(.4,r*.1);
  for(let i=0;i<3;i++){ c.beginPath(); c.arc(x+(i-1)*r*.1,y-i*r*.05,r*(.72-i*.2),Math.PI*(.85+i*.35),Math.PI*(2.05+i*.35)); c.stroke(); }
}
function bud(c,x,y,r){ petal(c,x,y+r*.2,x,y-r*1.3,r*.5,"#ffe6ef","#ff5f97","rgba(255,255,255,.5)"); petal(c,x,y+r*.2,x-r*.7,y-r*.8,r*.3,"#ffd3e2","#ff7aa8"); petal(c,x,y+r*.2,x+r*.7,y-r*.8,r*.3,"#ffd3e2","#ff7aa8"); }
function gem(c,x,y,r,col){
  c.fillStyle=lg(c,x-r,y-r,x+r,y+r,[[0,"#fff"],[.4,col],[1,"#2a1660"]]);
  c.beginPath(); c.moveTo(x,y-r); c.lineTo(x+r*.75,y); c.lineTo(x,y+r); c.lineTo(x-r*.75,y); c.closePath(); c.fill();
  c.fillStyle="rgba(255,255,255,.8)"; c.beginPath(); c.arc(x-r*.18,y-r*.32,r*.17,0,TAU); c.fill();
}
function bodyShape(c,s,h,rb){
  c.beginPath();
  c.moveTo(-s,0); c.lineTo(-s*rb,h*s);
  c.ellipse(0,h*s,s*rb,s*.28,0,Math.PI,0,true);
  c.lineTo(s,0); c.ellipse(0,0,s,s*.36,0,0,Math.PI,false); c.closePath();
}
function body(c,s,top,mid,bot,h,rb){
  rb=rb||.82;
  bodyShape(c,s,h,rb);
  c.fillStyle=lg(c,-s,0,s,0,[[0,bot],[.3,mid],[.55,top],[1,bot]]); c.fill();
  // vertical shading for volume
  c.save(); bodyShape(c,s,h,rb); c.clip();
  c.fillStyle=lg(c,0,0,0,h*s+s*.3,[[0,"rgba(255,255,255,.08)"],[1,"rgba(0,0,0,.35)"]]); c.fillRect(-s,0,2*s,h*s+s*.3);
  c.restore();
}
function baiSi(c,s,y,n,colA,colB,edge){
  // folded triangular banana-leaf points along the front rim
  for(let i=0;i<n;i++){
    const a=Math.PI*(i+.5)/n, x=-Math.cos(a)*s*.92, yy=Math.sin(a)*s*.33+y;
    const w=.085*s, h=.24*s;
    c.beginPath(); c.moveTo(x-w,yy); c.lineTo(x,yy+h); c.lineTo(x+w,yy); c.closePath();
    c.fillStyle=lg(c,x,yy,x,yy+h,[[0,colA],[1,colB]]); c.fill();
    c.strokeStyle=edge; c.lineWidth=Math.max(.4,.012*s); c.stroke();
    c.beginPath(); c.moveTo(x,yy); c.lineTo(x,yy+h*.8); c.strokeStyle="rgba(0,0,0,.18)"; c.stroke();
    c.fillStyle="#fffbe8"; c.beginPath(); c.arc(x,yy+h*.18,Math.max(.4,.014*s),0,TAU); c.fill();
  }
}
function rimEllipse(c,s,col,edge,rx,ry){
  c.fillStyle=col; c.beginPath(); c.ellipse(0,0,s*(rx||1),s*(ry||.36),0,0,TAU); c.fill();
  if(edge){ c.strokeStyle=edge; c.lineWidth=Math.max(.5,.025*s); c.stroke(); }
}

const RAINBOW=["#ff4d4d","#ff9a2e","#ffe04a","#4fcf63","#3f9bff","#9b5cff"];
function ringsFor(type){
  const R=[];
  const leaf=(i,sa)=>sa<0?["#1f5e1c","#4f9c40"]:["#2f7a29","#78c45f"];
  if(type==="banana") R.push({n:11,rx:.95,ry:.34,out:1.2,up:.66,w:.15,col:leaf,edge:"rgba(190,240,160,.55)",vein:"rgba(255,255,255,.22)"});
  if(type==="cat") R.push({n:8,rx:.95,ry:.34,out:1.12,up:.42,w:.14,col:leaf,edge:"rgba(190,240,160,.55)",vein:"rgba(255,255,255,.22)",off:.2});
  if(type==="pride") R.push({n:12,rx:.95,ry:.34,out:1.22,up:.68,w:.15,col:(i,sa)=>[sa<0?"#ffffff":"#fff7f0",RAINBOW[i%6]],edge:"rgba(255,255,255,.7)",vein:"rgba(255,255,255,.35)"});
  if(type==="lotus"){
    R.push({n:12,rx:.95,ry:.32,out:1.22,up:.36,w:.2,col:(i,sa)=>[sa<0?"#f7c9d8":"#fff0f5",sa<0?"#d9467d":"#ff6f9f"],edge:"rgba(255,230,240,.8)",vein:"rgba(200,60,110,.25)",y:.06});
    R.push({n:10,rx:.7,ry:.25,out:1.25,up:.62,w:.17,col:(i,sa)=>[sa<0?"#f9d2e0":"#fff4f8",sa<0?"#e0558a":"#ff86ad"],edge:"rgba(255,235,243,.85)",vein:"rgba(200,60,110,.22)",off:.3});
    R.push({n:8,rx:.4,ry:.15,out:1.3,up:.82,w:.14,col:(i,sa)=>["#fffafc",sa<0?"#ef6c9a":"#ffa3c1"],edge:"#fff",vein:"rgba(200,60,110,.2)",off:.1});
  }
  if(type==="coconut") R.push({n:7,rx:.85,ry:.3,out:1.28,up:.52,w:.12,col:leaf,edge:"rgba(190,240,160,.5)",vein:"rgba(255,255,255,.2)"});
  if(type==="star") R.push({n:10,rx:.95,ry:.34,out:1.26,up:.72,w:.11,col:(i,sa)=>[i%2?"rgba(120,220,255,.85)":"rgba(190,160,255,.85)","rgba(255,255,255,.95)"],edge:"rgba(255,255,255,.9)",vein:"rgba(255,255,255,.5)"});
  return R;
}

function krBase(c,k,s){
  const type=k.type;
  if(type==="banana"||type==="cat"||type==="pride"){
    const pride=type==="pride";
    const h = type==="cat" ? .42 : .3;
    body(c,s, pride?"#ffffff":"#4f9a40", pride?"#e9e4fb":"#3b7f31", pride?"#a9a0d4":"#173f14", h);
    // leaf veins
    c.save(); bodyShape(c,s,h,.82); c.clip(); c.strokeStyle= pride?"rgba(150,130,210,.25)":"rgba(200,255,170,.14)"; c.lineWidth=Math.max(.4,.012*s);
    for(let i=-7;i<=7;i++){ const x=i*.13*s; const y0=.36*s*Math.sqrt(Math.max(0,1-(x/s)**2)); c.beginPath(); c.moveTo(x,y0); c.lineTo(x*.82,h*s+.28*s*Math.sqrt(Math.max(0,1-(x/(s*.82))**2))); c.stroke(); }
    c.restore();
    if(pride){
      for(let i=0;i<12;i++){ const a=Math.PI*(i+.5)/12, x=-Math.cos(a)*s*.92, yy=Math.sin(a)*s*.33+.02*s; const col=RAINBOW[i%6];
        c.beginPath(); c.moveTo(x-.085*s,yy); c.lineTo(x,yy+.24*s); c.lineTo(x+.085*s,yy); c.closePath(); c.fillStyle=lg(c,x,yy,x,yy+.24*s,[[0,"#fff"],[1,col]]); c.fill(); }
    } else baiSi(c,s,.02*s,12,"#8ad070","#2f6f27","rgba(220,255,200,.6)");
    rimEllipse(c,s, pride?"#fbf9ff":"#5ea94d", pride?"rgba(170,150,230,.6)":"rgba(200,250,170,.5)");
  } else if(type==="lotus"){
    c.fillStyle=rg(c,0,.12*s,0,1.2*s,[[0,"#4d9a45"],[1,"#24561f"]]); c.beginPath(); c.ellipse(0,.12*s,1.18*s,.42*s,0,0,TAU); c.fill();
    c.strokeStyle="rgba(190,240,160,.25)"; c.lineWidth=Math.max(.4,.012*s);
    for(let i=0;i<16;i++){ const a=i/16*TAU; c.beginPath(); c.moveTo(0,.12*s); c.lineTo(Math.cos(a)*1.15*s,.12*s+Math.sin(a)*.41*s); c.stroke(); }
    c.fillStyle="#64b257"; c.beginPath(); c.ellipse(0,.08*s,1.0*s,.33*s,0,0,TAU); c.fill();
  } else if(type==="bread"){
    body(c,s,"#f2c07a","#d99a4f","#7d4718",.28);
    c.strokeStyle="rgba(90,45,10,.35)"; c.lineWidth=Math.max(.5,.02*s);
    for(let i=0;i<7;i++){ const x=(-.6+i*.2)*s; c.beginPath(); c.moveTo(x-.04*s,.42*s); c.lineTo(x+.05*s,.3*s); c.stroke(); }
    for(let i=0;i<16;i++){ const a=i/16*TAU; const x=Math.cos(a)*s*.92, y=Math.sin(a)*s*.33;
      c.fillStyle=rg(c,x-.04*s,y-.05*s,0,.15*s,[[0,"#ffe0a8"],[.6,"#eab26a"],[1,"#b87a36"]]); c.beginPath(); c.arc(x,y,.14*s,0,TAU); c.fill(); }
    c.fillStyle=rg(c,0,0,0,s,[[0,"#ffe4b0"],[1,"#e9b874"]]); c.beginPath(); c.ellipse(0,0,s*.88,s*.31,0,0,TAU); c.fill();
    const R=mulberry(77); c.fillStyle="#fff7e0"; for(let i=0;i<14;i++){ c.beginPath(); c.ellipse((R()-.5)*1.4*s,(R()-.5)*.4*s,.025*s,.012*s,R()*3,0,TAU); c.fill(); }
  } else if(type==="coconut"){
    body(c,s*.95,"#9a6a42","#7a4d2a","#2e1a0c",.4);
    c.strokeStyle="rgba(25,12,4,.4)"; c.lineWidth=Math.max(.4,.014*s);
    const R=mulberry(31);
    for(let i=0;i<28;i++){ const x=(R()-.5)*1.7*s; c.beginPath(); c.moveTo(x,.1*s+R()*.1*s); c.quadraticCurveTo(x+(R()-.5)*.1*s,.3*s,x*.88,.45*s+R()*.1*s); c.stroke(); }
    rimEllipse(c,s,"#fbf3e2",null,.95,.34);
    c.fillStyle=rg(c,0,.04*s,0,.8*s,[[0,"#5a3a20"],[1,"#2d1a0b"]]); c.beginPath(); c.ellipse(0,.02*s,s*.82,s*.27,0,0,TAU); c.fill();
  } else if(type==="star"){
    body(c,s,"#4b39a8","#33237e","#0d0730",.3);
    const R=mulberry(9); for(let i=0;i<26;i++){ const x=(R()-.5)*1.7*s, y=.08*s+R()*.42*s; c.fillStyle=R()<.5?"#ffd86a":"#bfeaff"; c.beginPath(); c.arc(x,y,Math.max(.4,.016*s),0,TAU); c.fill(); }
    rimEllipse(c,s,"#6750d0","rgba(200,230,255,.6)");
  }
  if(type==="cat"){
    for(const sx of [-1,1]){
      c.fillStyle=lg(c,sx*.6*s,-1*s,sx*.6*s,0,[[0,"#7cc566"],[1,"#245c1f"]]);
      c.beginPath(); c.moveTo(sx*.22*s,-.1*s); c.lineTo(sx*.62*s,-1.02*s); c.lineTo(sx*.88*s,-.05*s); c.closePath(); c.fill();
      c.fillStyle=lg(c,0,-.8*s,0,0,[[0,"#ffc2d7"],[1,"#ff7fa8"]]);
      c.beginPath(); c.moveTo(sx*.37*s,-.15*s); c.lineTo(sx*.62*s,-.78*s); c.lineTo(sx*.75*s,-.12*s); c.closePath(); c.fill();
    }
  }
}

function krCluster(c,k,s,variant){
  const type=k.type, R=mulberry(1234+variant*97+type.length*13);
  c.fillStyle = type==="star" ? rg(c,0,-.1*s,0,.6*s,[[0,"#3a2a80"],[1,"#1b1250"]]) : rg(c,0,-.1*s,0,.6*s,[[0,"#4d8a3a"],[1,"#24501b"]]);
  c.beginPath(); c.ellipse(0,-.02*s,.58*s,.26*s,0,0,TAU); c.fill();
  if(type!=="star"){ for(let i=0;i<7;i++){ const a=-Math.PI*(.1+.8*i/6); petal(c,Math.cos(a)*.25*s,-.05*s,Math.cos(a)*.62*s,-.05*s+Math.sin(a)*.42*s,.06*s,"#2c6e25","#6cbf52","rgba(200,255,170,.35)"); } }
  // incense sticks (tips are animated)
  c.lineCap="round";
  for(const sx of [-1,1]){
    c.strokeStyle="#c0392b"; c.lineWidth=Math.max(.8,.03*s); c.beginPath(); c.moveTo(sx*.2*s,-.06*s); c.lineTo(sx*.23*s,-.35*s); c.stroke();
    c.strokeStyle="#7a3a1c"; c.lineWidth=Math.max(.7,.024*s); c.beginPath(); c.moveTo(sx*.23*s,-.35*s); c.lineTo(sx*.32*s,-.95*s); c.stroke();
  }
  // candle
  const cd=CANDLE_BY[k.candle]||CANDLES[0];
  const cw=.13*s, ch=.56*s, cb=-.1*s, ct=cb-ch;
  c.fillStyle=lg(c,-cw/2,0,cw/2,0,[[0,cd.d],[.35,cd.c],[.6,"#ffffff"],[1,cd.d]]);
  c.fillRect(-cw/2,ct,cw,ch);
  c.fillStyle=cd.c; c.beginPath(); c.ellipse(0,ct,cw/2,cw*.18,0,0,TAU); c.fill();
  c.fillStyle="rgba(255,255,255,.55)"; c.beginPath(); c.moveTo(cw*.18,ct); c.quadraticCurveTo(cw*.3,ct+ch*.25,cw*.22,ct+ch*.32); c.quadraticCurveTo(cw*.12,ct+ch*.2,cw*.1,ct); c.fill();
  c.strokeStyle="#2b1a10"; c.lineWidth=Math.max(.6,.016*s); c.beginPath(); c.moveTo(0,ct); c.quadraticCurveTo(.01*s,ct-.03*s,0,ct-.05*s); c.stroke();
  // flowers, sorted back→front
  const pts=[]; for(let i=0;i<13;i++){ const a=R()*TAU, rr=.18+R()*.34; pts.push({x:Math.cos(a)*rr*s,y:-.05*s+Math.sin(a)*rr*.42*s,r:(.085+R()*.05)*s,i,front:Math.sin(a)>0}); }
  pts.sort((a,b)=>a.y-b.y);
  for(const p of pts){
    if(Math.abs(p.x)<.1*s && p.y<-.02*s) continue; // keep candle base clear
    const i=p.i;
    if(type==="pride") marigold(c,p.x,p.y,p.r,RAINBOW[i%6],"#ffffff");
    else if(type==="star"){ if(i%3===0) jasmine(c,p.x,p.y,p.r); else gem(c,p.x,p.y,p.r*.8,["#7fe3ff","#c7a8ff","#ffd86a"][i%3]); }
    else if(type==="lotus"){ if(i%3===0) bud(c,p.x,p.y,p.r); else if(i%3===1) jasmine(c,p.x,p.y,p.r); else marigold(c,p.x,p.y,p.r*.9,"#ffd23f","#fff1a8"); }
    else { const m=i%5; if(m<2) marigold(c,p.x,p.y,p.r,m?"#ff9a1f":"#ffc12e",m?"#ffcf5a":"#ff8a1a"); else if(m===2) jasmine(c,p.x,p.y,p.r); else if(m===3) rose(c,p.x,p.y,p.r*.85,"#ff8fb8","#c43a6e"); else marigold(c,p.x,p.y,p.r*.8,"#e8455a","#ff8a8a"); }
  }
}

function krFront(c,k,s){
  if(k.type==="cat"){

function makeLotusPads(R){

function kPos(k,t,now){

  rabbitFade=Math.min(1,rabbitFade+.03);
  const h=r*1.25, w=h*rabbitTint.width/rabbitTint.height, hop=Math.max(0,Math.sin(t*2.2))*r*.04;
  c.save(); c.beginPath(); c.arc(x,y,r*.97,0,TAU); c.clip();
  c.globalAlpha=.5*rabbitFade; c.drawImage(rabbitTint,x-w*.5,y-h*.55-hop,w,h);
  c.restore();
}
function splash(x,y,s,celebrate){
  ripples.push({x,y,r:s*3.2,life:0,dur:1.8,c:"255,220,160"}); ripples.push({x,y,r:s*2,life:-.2,dur:1.5});
  for(let i=0;i<22;i++){ const a=-Math.PI*Math.random(); sparks.push({x,y,vx:Math.cos(a)*rnd(20,90),vy:Math.sin(a)*rnd(60,150),g:280,life:0,dur:rnd(.5,.9),r:rnd(1,2.2),c:"200,225,255"}); }
  if(celebrate){
    for(let i=0;i<46;i++){ const a=rnd(-Math.PI*.95,-Math.PI*.05); sparks.push({x,y:y-s,vx:Math.cos(a)*rnd(20,120),vy:Math.sin(a)*rnd(40,170),g:-6,drag:1.6,life:0,dur:rnd(1.2,2.4),r:rnd(1,2.4),c:Math.random()<.6?"255,210,120":"255,160,200",twinkle:Math.random()<.5}); }
    for(let i=0;i<14;i++){ const d=Math.min(1,Math.max(0,(y-HOR)/(H-HOR)+rnd(-.05,.05))); petals.push({x:x+rnd(-s*2,s*2),d,r:Math.random()*TAU,vr:rnd(-1,1),col:["#ff9fbf","#ffd36a","#ffffff"][i%3],vx:rnd(3,8),p:Math.random()*7}); }
    if(petals.length>80) petals.splice(0,petals.length-80);
  }
  sfx("splash");
}
function addLantern(x,y,auto){ if(lanterns.length>90) return; const s=auto?rnd(4,9):rnd(9,13); lanterns.push({x,y,vy:-rnd(14,30)*(s/8),sway:rnd(4,14),s,p:Math.random()*7,mine:!auto}); }
const FW_KINDS=["peony","peony","ring","willow","heart","crackle"];
function launch(x,kind){ rockets.push({x,y:HOR,vx:rnd(-12,12),vy:-rnd(270,370)*(H/800+.3),ty:rnd(.1,.35)*H,kind:kind||FW_KINDS[Math.random()*FW_KINDS.length|0]}); sfx("whistle"); }

function startBoat(){ const l=.04; boat.on=true; boat.dir=Math.random()<.5?1:-1; boat.s=unit()*.75; boat.y=laneY(l)-2; boat.x=boat.dir>0?-boat.s*3:W+boat.s*3; boat.flash=0; }
function drawBoat(c,t,dt){
  if(scene!==0){ boat.on=false; return; }
  boat.next-=dt; if(!boat.on && boat.next<0){ startBoat(); boat.next=rnd(22,38); }
  if(!boat.on) return;
  boat.x+=boat.dir*W/22*dt; boat.flash=Math.max(0,boat.flash-dt);
  if(boat.x<-boat.s*4||boat.x>W+boat.s*4){ boat.on=false; return; }
  const s=boat.s;
  if(PROP.boat.ok){ c.save(); c.translate(boat.x,boat.y); c.scale(boat.dir,1); const w=s*5.6;
    c.save(); c.globalCompositeOperation="lighter"; c.fillStyle=rg(c,0,0,0,w*.6,[[0,"rgba(255,200,120,.18)"],[1,"rgba(255,200,120,0)"]]); c.beginPath(); c.ellipse(0,0,w*.6,s*1.2,0,0,TAU); c.fill(); c.restore();
    const h=propDraw(c,"boat",0,s*.45,w,w<200);
    if(boat.flash>0){ c.save(); c.globalCompositeOperation="lighter"; for(let i=0;i<=24;i++){ const lx=-w*.36+i*w*.7/24, ly=s*.45-h*.82+Math.sin(i/24*Math.PI)*-h*.05; c.fillStyle=`hsla(${(i*30+t*400)%360},100%,65%,.9)`; c.beginPath(); c.arc(lx,ly,Math.max(1.5,s*.07),0,TAU); c.fill(); } c.restore(); }
    c.restore(); return; }
  c.save(); c.translate(boat.x,boat.y); c.scale(boat.dir,1);
  // reflections of the lit windows
  c.save(); c.globalCompositeOperation="lighter";
  for(let i=0;i<10;i++){ const wx=-1.7*s+i*.36*s; for(let j=0;j<6;j++){ c.fillStyle=`rgba(255,200,110,${.22*(1-j/6)})`; c.fillRect(wx+Math.sin(t*3+i+j)*2,s*.3+j*s*.22,s*.18,s*.06); } }
  c.restore();
  c.fillStyle="#120d1c"; c.beginPath(); c.moveTo(-2.3*s,-.1*s); c.lineTo(2.1*s,-.1*s); c.quadraticCurveTo(2.6*s,-.15*s,2.7*s,-.45*s); c.lineTo(2.35*s,.22*s); c.lineTo(-2.1*s,.22*s); c.closePath(); c.fill();
  c.fillStyle="#2a1f3a"; c.fillRect(-1.9*s,-.62*s,3.6*s,.54*s);
  c.fillStyle="#1a1328"; c.fillRect(-2*s,-.7*s,3.8*s,.1*s);
  for(let i=0;i<10;i++){ const fl=.8+.2*Math.sin(t*5+i*1.7); c.fillStyle=`rgba(255,${200*fl|0},110,.95)`; c.fillRect(-1.75*s+i*.35*s,-.5*s,.22*s,.24*s); }
  for(let i=0;i<=22;i++){ const lx=-2*s+i*3.8*s/22, ly=-.78*s-Math.sin(i/22*Math.PI)*.12*s;
    const col = boat.flash>0 ? `hsl(${(i*30+t*400)%360},100%,65%)` : (i%3===0?"#ffd36a":i%3===1?"#ff8fb8":"#9fdcff");
    c.fillStyle=col; c.beginPath(); c.arc(lx,ly,Math.max(1.2,s*.05),0,TAU); c.fill(); }
  c.restore();
}
function tapBoat(x,y){ if(!boat.on) return false; if(Math.abs(x-boat.x)<boat.s*2.6 && Math.abs(y-(boat.y-boat.s*.3))<boat.s*.8){ boat.flash=3; sfx("horn"); toast("ปู๊นๆ เรือไฟทักทาย สุขสันต์วันลอยกระทง!"); for(let i=0;i<40;i++){ const a=-Math.PI/2+rnd(-1,1); sparks.push({x:boat.x,y:boat.y-boat.s,vx:Math.cos(a)*rnd(40,120),vy:Math.sin(a)*rnd(60,160),g:60,life:0,dur:rnd(1,1.8),r:rnd(1,2),c:["255,210,120","255,140,190","150,220,255"][i%3],twinkle:true}); } return true; } return false; }

function tapLotus(x,y){
  for(let i=pads.length-1;i>=0;i--){ const p=pads[i]; if(Math.abs(x-p.x)<p.r && y>p.y-p.r*.95 && y<p.y+p.r*.4){
    if(p.kind!=="bloom"){ p.kind="bloom"; p.grow=.05; if(Math.random()<.35) p.white=!p.white; toast("ดอกบัวบานแล้ว ขอให้ใจเบิกบานแบบนี้นะ"); }
    for(let j=0;j<36;j++){ const a=-Math.PI/2+rnd(-1.1,1.1); sparks.push({x:p.x,y:p.y-p.r*.4,vx:Math.cos(a)*rnd(20,90),vy:Math.sin(a)*rnd(40,140),g:-6,drag:1.4,life:0,dur:rnd(1.2,2.2),r:rnd(1,2.2),c:Math.random()<.5?"255,170,210":"255,230,140",twinkle:true}); }
    ripples.push({x:p.x,y:p.y,r:p.r*2,life:0,dur:1.5,c:"255,190,220"}); sfx("bless"); return true; } }
  return false;
}
function wakeFireflies(x,y){
  const k=unit()*.13;
  for(let i=0;i<46;i++){ const u=i/46*TAU; const tx=x+16*Math.sin(u)**3*k, ty=y-(13*Math.cos(u)-5*Math.cos(2*u)-2*Math.cos(3*u)-Math.cos(4*u))*k - k*20;
    const a=Math.random()*TAU; swarm.push({x,y,vx:Math.cos(a)*rnd(40,140),vy:Math.sin(a)*rnd(40,140),tx,ty,life:0,dur:6,p:Math.random()*7}); }
  if(swarm.length>230) swarm.splice(0,swarm.length-230);
  sfx("chime"); toast("หิ่งห้อยตื่นแล้ว… บินเป็นรูปหัวใจให้");
}
function addUserStar(x,y){
  const now=performance.now(); if(now-lastStarAt>20000) userStars.length=0; lastStarAt=now;
  userStars.push({x,y,t0:now}); if(userStars.length>15) userStars.shift();
  sfx("chime");
  if(userStars.length%5===0){ const nm=STAR_NAMES[Math.random()*STAR_NAMES.length|0]; toast(`เกิดกลุ่มดาวใหม่: “กลุ่มดาว${nm}” ✦`); for(let i=0;i<7;i++) setTimeout(()=>meteors.push({x:rnd(.1,.9)*W,y:rnd(.03,.25)*HOR,vx:rnd(260,420)*(Math.random()<.5?-1:1),vy:rnd(90,160),life:0,dur:rnd(.7,1.1)}),i*220); sfx("bless"); }
}
function portal(x,y,flat){
  runeBursts.push({x,y,life:0,dur:flat?1.8:2.2,r:unit()*(flat?2.2:3.2),flat,glyph:true});
  if(!flat){ flash={a:.8,x,y,c:"190,150,255"}; for(let i=0;i<80;i++){ const a=Math.random()*TAU, sp=rnd(40,200); sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:8,drag:1.3,life:0,dur:rnd(1.2,2.4),r:rnd(1,2.4),c:Math.random()<.5?"200,160,255":"150,240,255",twinkle:true}); } toast("ประตูมิติเปิดแล้ว… ✦"); sfx("bless"); }
  else sfx("drop");
}

function drawGimmicksBack(c,t,dt){ drawBoat(c,t,dt); }
function drawGimmicksFront(c,t,dt){
  // firefly hearts
  if(swarm.length){ c.save(); c.globalCompositeOperation="lighter";
    for(let i=swarm.length-1;i>=0;i--){ const f=swarm[i]; f.life+=dt; if(f.life>f.dur){ swarm.splice(i,1); continue; }
      if(f.life<.8){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=.96; f.vy*=.96; }
      else if(f.life<3.6){ f.x+=(f.tx-f.x)*Math.min(1,dt*3); f.y+=(f.ty-f.y)*Math.min(1,dt*3); }
      else { f.x+=Math.sin(f.life*2+f.p)*.6; f.y-=dt*25; }
      const a=Math.min(1,(f.dur-f.life))*(.6+.4*Math.sin(t*6+f.p));
      c.fillStyle=`rgba(220,255,130,${a})`; c.beginPath(); c.arc(f.x,f.y,1.8,0,TAU); c.fill();
      c.fillStyle=`rgba(220,255,130,${a*.18})`; c.beginPath(); c.arc(f.x,f.y,5,0,TAU); c.fill(); }
    c.restore(); }
  // constellation
  if(userStars.length){
    const now=performance.now();
    if(now-lastStarAt>25000){ userStars.length=0; }
    else { c.save(); c.globalCompositeOperation="lighter"; const fade=Math.min(1,(25000-(now-lastStarAt))/4000);
      c.strokeStyle=`rgba(190,220,255,${.55*fade})`; c.lineWidth=1.2; c.setLineDash([4,5]); c.beginPath();
      userStars.forEach((st,i)=>{ i?c.lineTo(st.x,st.y):c.moveTo(st.x,st.y); }); c.stroke(); c.setLineDash([]);
      for(const st of userStars){ const tw=.7+.3*Math.sin(t*4+st.x); const r=3.2*tw;
        c.fillStyle=`rgba(255,255,255,${fade})`; c.beginPath(); c.arc(st.x,st.y,r*.6,0,TAU); c.fill();
        c.fillStyle=`rgba(170,210,255,${.35*fade})`; c.beginPath(); c.arc(st.x,st.y,r*3,0,TAU); c.fill();
        c.fillStyle=`rgba(255,255,255,${.8*fade})`; c.fillRect(st.x-r*3,st.y-.5,r*6,1); c.fillRect(st.x-.5,st.y-r*3,1,r*6); }
      c.restore(); } }
  // rune / bell rings
  for(let i=runeBursts.length-1;i>=0;i--){ const b=runeBursts[i]; b.life+=dt; const k=b.life/b.dur; if(k>=1){ runeBursts.splice(i,1); continue; }
    const r=b.r*(.3+k*.9), a=1-k; c.save(); c.translate(b.x,b.y); if(b.flat) c.scale(1,.32); c.globalCompositeOperation="lighter";
    const col=b.col||(b.gold?"255,215,130":"190,160,255");
    c.strokeStyle=`rgba(${col},${a*.8})`; c.lineWidth=1.6; c.beginPath(); c.arc(0,0,r,0,TAU); c.stroke(); c.beginPath(); c.arc(0,0,r*.82,0,TAU); c.stroke();
    if(b.glyph){ c.rotate(b.life*.8); c.font=`600 ${Math.max(9,r*.16)}px "Bai Jamjuree",sans-serif`; c.fillStyle=`rgba(170,240,255,${a})`; c.textAlign="center"; c.textBaseline="middle";
      for(let j=0;j<16;j++){ c.save(); c.rotate(j/16*TAU); c.fillText(YANT[(j*3)%YANT.length],0,-r*.91); c.restore(); }
      c.strokeStyle=`rgba(${col},${a*.5})`; c.beginPath(); for(let j=0;j<6;j++){ const q=j*TAU/6*2; j?c.lineTo(Math.cos(q)*r*.7,Math.sin(q)*r*.7):c.moveTo(Math.cos(q)*r*.7,Math.sin(q)*r*.7); } c.closePath(); c.stroke(); }
    c.restore(); }
}
function rabbitTap(x,y){
  const im=toImg(x,y); if(!im || im.x<480 || im.x>590 || im.y<250 || im.y>355) return false;
  const B=BACKDROPS[scene]; const cx=bdFit.ox+535*bdFit.sc, cy=bdFit.oy+300*bdFit.sc;
  for(let i=0;i<30;i++){ const u=i/30*TAU, k=unit()*.08; sparks.push({x:cx,y:cy-unit()*.6,vx:16*Math.sin(u)**3*k*9,vy:-(13*Math.cos(u)-5*Math.cos(2*u)-2*Math.cos(3*u)-Math.cos(4*u))*k*9,g:10,drag:1.5,life:0,dur:1.8,r:1.8,c:i%2?"255,230,250":"220,200,255",twinkle:true}); }
  for(let i=0;i<4;i++) setTimeout(()=>addLantern(cx+rnd(-40,40),cy-20,false),i*180);
  sfx("bless"); toast("กระต่ายจันทร์อวยพร ขอให้ปีนี้สมหวังทุกเรื่อง ♡");
  return true;
}
function sceneTap(x,y){
  const im=toImg(x,y);
  if(scene===0){ if(tapBoat(x,y)) return true; if(im && im.x>20 && im.x<930 && im.y>170 && im.y<455){ ringBell(x,y); return true; } }
  if(scene===1){ if(tapLotus(x,y)) return true; if(im && im.x>1120 && im.x<1335 && im.y>245 && im.y<395){ for(let i=0;i<5;i++) setTimeout(()=>addLantern(x+rnd(-30,30),y-10,false),i*160); sfx("chime"); toast("ศาลาปล่อยโคมให้แล้ว"); return true; } }
  if(scene===2 && y<HOR && y>HOR-HOR*.5){ wakeFireflies(x,y); return true; }
  if(scene===3 && y<HOR){ addUserStar(x,y); return true; }
  if(scene===MAGIC_SCENE){ if(im && im.x>1280 && im.x<1660 && im.y>80 && im.y<400){ portal(x,y,false); return true; } if(y>HOR){ portal(x,y,true); ripples.push({x,y,r:unit()*2,life:0,dur:1.5,c:"170,150,255"}); return true; } }
  return false;
}

/* ================= sound ================= */
let AC=null, master=null, ambOn=false, ambNodes=null, chimeTimer=0;
function unlockAudio(){ if(ambOn&&AC&&AC.state==="suspended") AC.resume(); }
function ensureAC(){ if(AC) return AC; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.8; master.connect(AC.destination); }catch(e){ AC=null; } return AC; }
function noiseBuf(sec,brown){ const n=AC.sampleRate*sec, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); let l=0; for(let i=0;i<n;i++){ const w=Math.random()*2-1; if(brown){ l=(l+.02*w)/1.02; d[i]=l*3.5; } else d[i]=w; } return b; }
function startAmbient(){ if(!ensureAC()) return; AC.resume();
  const src=AC.createBufferSource(); src.buffer=noiseBuf(4,true); src.loop=true;
  const f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=600; const gn=AC.createGain(); gn.gain.value=.14;
  const lfo=AC.createOscillator(); lfo.frequency.value=.12; const lgn=AC.createGain(); lgn.gain.value=200; lfo.connect(lgn); lgn.connect(f.frequency); lfo.start();
  src.connect(f); f.connect(gn); gn.connect(master); src.start(); ambNodes={src,lfo};
  playMusic();
}
function stopAmbient(){ if(ambNodes){ try{ ambNodes.src.stop(); ambNodes.lfo.stop(); }catch(e){} ambNodes=null; } clearTimeout(chimeTimer); stopMusic(); }
/* background music (made with PixelLab): two takes per track, one picked at random per visit, cross-faded loop */
const TRACKS={main:["audio/main_1.mp3","audio/main_2.mp3"],magic:["audio/magic_1.mp3","audio/magic_2.mp3"]};
const takeOf={main:Math.random()*2|0,magic:Math.random()*2|0};
const trackBuf={}; let musicKey=null, curLayer=null, loopTimer=0;
async function loadTrack(k){ if(trackBuf[k]) return trackBuf[k]; const r=await fetch(TRACKS[k][takeOf[k]]); if(!r.ok) throw new Error("track"); const ab=await r.arrayBuffer(); trackBuf[k]=await new Promise((ok,no)=>AC.decodeAudioData(ab,ok,no)); return trackBuf[k]; }
function fadeLayer(L,secs){ if(!L) return; const now=AC.currentTime; L.g.gain.cancelScheduledValues(now); L.g.gain.setValueAtTime(L.g.gain.value,now); L.g.gain.linearRampToValueAtTime(0,now+secs); setTimeout(()=>{ try{ L.src.stop(); }catch(e){} },secs*1000+200); }
function runLoop(k,buf,fade){
  fadeLayer(curLayer,fade);
  const now=AC.currentTime, g=AC.createGain(); g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(.6,now+fade); g.connect(master);
  const src=AC.createBufferSource(); src.buffer=buf; src.connect(g); src.start(); curLayer={src,g};
  clearTimeout(loopTimer); loopTimer=setTimeout(()=>{ if(musicKey===k&&ambOn) runLoop(k,buf,4); },Math.max(5,buf.duration-4)*1000);
}
async function playMusic(){
  if(!ambOn||!AC) return; const k=(scene===MAGIC_SCENE||inDungeon())?"magic":"main"; if(musicKey===k) return; musicKey=k;
  let buf; try{ buf=await loadTrack(k); }catch(e){ musicKey=null; return; }
  if(musicKey!==k||!ambOn) return;
  runLoop(k,buf,2.5);
}
function stopMusic(){ clearTimeout(loopTimer); if(curLayer&&AC) fadeLayer(curLayer,.8); curLayer=null; musicKey=null; }
const PENTA=[261.6,293.7,329.6,392,440,523.3,587.3,659.3,784,880];
function tone(freq,when,dur,vol,type){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||"sine"; o.frequency.value=freq; g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(vol,when+.01); g.gain.exponentialRampToValueAtTime(.0001,when+dur); o.connect(g); g.connect(master); o.start(when); o.stop(when+dur+.05); }
function sfx(kind,soft){
  if(!ambOn||!AC) return; const n=AC.currentTime;
  if(kind==="chime"){ const f=PENTA[Math.random()*PENTA.length|0]; tone(f,n,1.6,soft?.06:.12,"triangle"); tone(f*2,n,.8,soft?.02:.04); tone(f,n+.32,1.2,soft?.025:.05,"triangle"); }
  else if(kind==="drop"){ const o=AC.createOscillator(),g=AC.createGain(); o.frequency.setValueAtTime(900,n); o.frequency.exponentialRampToValueAtTime(240,n+.18); g.gain.setValueAtTime(.12,n); g.gain.exponentialRampToValueAtTime(.0001,n+.25); o.connect(g); g.connect(master); o.start(n); o.stop(n+.3); }
  else if(kind==="splash"){ const s=AC.createBufferSource(); s.buffer=noiseBuf(.6); const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1200; const g=AC.createGain(); g.gain.setValueAtTime(.25,n); g.gain.exponentialRampToValueAtTime(.0001,n+.55); s.connect(f); f.connect(g); g.connect(master); s.start(n); [0,2,4,7].forEach((i,j)=>tone(PENTA[i+2],n+.15+j*.12,1.4,.08,"triangle")); }
  else if(kind==="whistle"){ const o=AC.createOscillator(),g=AC.createGain(); o.frequency.setValueAtTime(600,n); o.frequency.exponentialRampToValueAtTime(1800,n+.9); g.gain.setValueAtTime(.02,n); g.gain.linearRampToValueAtTime(0,n+.9); o.connect(g); g.connect(master); o.start(n); o.stop(n+1); }
  else if(kind==="boom"){ const s=AC.createBufferSource(); s.buffer=noiseBuf(1.5,true); const f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=300; const g=AC.createGain(); g.gain.setValueAtTime(.9,n); g.gain.exponentialRampToValueAtTime(.0001,n+1.4); s.connect(f); f.connect(g); g.connect(master); s.start(n);
    const s2=AC.createBufferSource(); s2.buffer=noiseBuf(1); const f2=AC.createBiquadFilter(); f2.type="highpass"; f2.frequency.value=3000; const g2=AC.createGain(); g2.gain.setValueAtTime(0,n); g2.gain.linearRampToValueAtTime(.06,n+.2); g2.gain.exponentialRampToValueAtTime(.0001,n+1); s2.connect(f2); f2.connect(g2); g2.connect(master); s2.start(n); }
  else if(kind==="bonk"){ const o=AC.createOscillator(),g=AC.createGain(); o.type="triangle"; o.frequency.setValueAtTime(180,n); o.frequency.exponentialRampToValueAtTime(70,n+.18); g.gain.setValueAtTime(.35,n); g.gain.exponentialRampToValueAtTime(.0001,n+.25); o.connect(g); g.connect(master); o.start(n); o.stop(n+.3);
    const s2=AC.createBufferSource(); s2.buffer=noiseBuf(.3); const f2=AC.createBiquadFilter(); f2.type="bandpass"; f2.frequency.value=900; const g2=AC.createGain(); g2.gain.setValueAtTime(.18,n); g2.gain.exponentialRampToValueAtTime(.0001,n+.25); s2.connect(f2); f2.connect(g2); g2.connect(master); s2.start(n); }
  else if(kind==="sink"){ const o=AC.createOscillator(),g=AC.createGain(); o.type="sine"; o.frequency.setValueAtTime(520,n); o.frequency.exponentialRampToValueAtTime(90,n+1.2); g.gain.setValueAtTime(.15,n); g.gain.exponentialRampToValueAtTime(.0001,n+1.3); o.connect(g); g.connect(master); o.start(n); o.stop(n+1.4); }
  else if(kind==="win"){ [0,2,4,7,9,7].forEach((i,j)=>tone(PENTA[i]*(j>3?2:1),n+j*.13,1.4,.11,"triangle")); }
  else if(kind==="bell"){ [[196,3.2,.22],[392.5,2.4,.08],[588,1.8,.05],[784*1.01,1.2,.03]].forEach(([f,d,v])=>tone(f,n,d,v,"sine")); }
  else if(kind==="horn"){ [110,138.6].forEach(f=>{ const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter(); o.type="sawtooth"; o.frequency.value=f; lp.type="lowpass"; lp.frequency.value=600; g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(.08,n+.05); g.gain.setValueAtTime(.08,n+.5); g.gain.linearRampToValueAtTime(0,n+.7); o.connect(lp); lp.connect(g); g.connect(master); o.start(n); o.stop(n+.75); }); }
  else if(kind==="bless"){ [0,2,4,5,7,9].forEach((i,j)=>tone(PENTA[i],n+j*.08,1.2,.09,"triangle")); }
}

/* ---- photo cropper ---- */
const crop={img:null,zoom:1,ox:0,oy:0}, CROP=160, OUT=192;
const cropCv=$("cropCv"), zoomEl=$("zoom");
function cropBase(){ return CROP/Math.min(crop.img.width,crop.img.height); }
function clampCrop(){ if(!crop.img) return; const sc=cropBase()*crop.zoom; const mx=Math.max(0,(crop.img.width*sc-CROP)/2), my=Math.max(0,(crop.img.height*sc-CROP)/2); crop.ox=Math.max(-mx,Math.min(mx,crop.ox)); crop.oy=Math.max(-my,Math.min(my,crop.oy)); }
function renderCrop(c,size){ const k=size/CROP, sc=cropBase()*crop.zoom*k, w=crop.img.width*sc, h=crop.img.height*sc; c.drawImage(crop.img,size/2-w/2+crop.ox*k,size/2-h/2+crop.oy*k,w,h); }
function drawCropView(){
  const d=Math.min(2,devicePixelRatio||1); cropCv.width=CROP*d; cropCv.height=CROP*d;
  const c=cropCv.getContext("2d"); c.setTransform(d,0,0,d,0,0); c.clearRect(0,0,CROP,CROP);
  if(!crop.img){ c.fillStyle="rgba(255,255,255,.05)"; c.fillRect(0,0,CROP,CROP); c.fillStyle="#9b97b8"; c.font='500 13px "Bai Jamjuree",sans-serif'; c.textAlign="center"; c.fillText("ยังไม่มีรูป",CROP/2,CROP/2+4); return; }
  renderCrop(c,CROP);
}
let commitT=0;
function commitCrop(){ clearTimeout(commitT); commitT=setTimeout(()=>{ if(!crop.img) return; const o=document.createElement("canvas"); o.width=o.height=OUT; const c=o.getContext("2d"); c.fillStyle="#fff"; c.fillRect(0,0,OUT,OUT); renderCrop(c,OUT); form.photo=o.toDataURL("image/jpeg",.84); const im=new Image(); im.onload=()=>{ form.photoImg=im; }; im.src=form.photo; },120); }
function setPhotoUI(){ const has=!!crop.img; zoomEl.disabled=!has; $("btnNoPhoto").hidden=!has; $("cropHint").textContent = has ? "ลากรูปเพื่อจัดตำแหน่ง เลื่อนแถบเพื่อซูม" : "รูปหน้าคุณ คนรัก หรือน้องหมาน้องแมว ก็ได้"; $("crop").classList.toggle("has",has); }
$("inPhoto").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
  if(f.size>20*1024*1024){ $("err").textContent="รูปใหญ่เกินไป เลือกรูปที่เล็กกว่า 20MB นะ"; return; }
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{ const m=1200/Math.max(im.width,im.height), sc=Math.min(1,m); const o=document.createElement("canvas"); o.width=Math.round(im.width*sc); o.height=Math.round(im.height*sc); o.getContext("2d").drawImage(im,0,0,o.width,o.height); URL.revokeObjectURL(url);
    crop.img=o; crop.zoom=1; crop.ox=0; crop.oy=0; zoomEl.value=1; setPhotoUI(); drawCropView(); commitCrop(); $("err").textContent=""; };
  im.onerror=()=>{ URL.revokeObjectURL(url); $("err").textContent="เปิดรูปนี้ไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG นะ"; };
  im.src=url;
});
zoomEl.addEventListener("input",()=>{ crop.zoom=+zoomEl.value; clampCrop(); drawCropView(); commitCrop(); });
$("btnNoPhoto").addEventListener("click",()=>{ crop.img=null; form.photo=null; form.photoImg=null; setPhotoUI(); drawCropView(); });
let drag=null;
cropCv.addEventListener("pointerdown",e=>{ if(!crop.img) { $("inPhoto").click(); return; } drag={x:e.clientX,y:e.clientY,ox:crop.ox,oy:crop.oy}; cropCv.setPointerCapture(e.pointerId); });
cropCv.addEventListener("pointermove",e=>{ if(!drag) return; crop.ox=drag.ox+(e.clientX-drag.x); crop.oy=drag.oy+(e.clientY-drag.y); clampCrop(); drawCropView(); });
const endDrag=()=>{ if(drag){ drag=null; commitCrop(); } };
cropCv.addEventListener("pointerup",endDrag); cropCv.addEventListener("pointercancel",endDrag);
cropCv.addEventListener("wheel",e=>{ if(!crop.img) return; e.preventDefault(); crop.zoom=Math.max(1,Math.min(4,crop.zoom*(e.deltaY<0?1.08:.93))); zoomEl.value=crop.zoom; clampCrop(); drawCropView(); commitCrop(); },{passive:false});
