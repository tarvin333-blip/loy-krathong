<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ลอยกระทงออนไลน์ ใส่ชื่อ คำอธิษฐาน เลือกกระทง แล้วลอยไปพร้อมกับทุกคน">
<meta property="og:title" content="ลอยกระทงออนไลน์">
<meta property="og:description" content="มาลอยกระทงด้วยกันคืนวันเพ็ญ">
<title>ลอยกระทงออนไลน์</title>
<link rel="preload" as="image" href="img/grand-palace.webp" type="image/webp">
<link rel="preload" as="image" href="img/lake-pavilion.webp" type="image/webp">
<link rel="preload" as="image" href="img/forest-lake.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Srisakdi:wght@700&family=Bai+Jamjuree:wght@400;500;600;700&family=Charm:wght@400;700&display=swap">
<style>
/* Layout: one full-screen night river canvas; floating glass controls on top; a bottom sheet for making a krathong. Single committed night look. */
:root{
  --night:#070b24;
  --ink:#f6efe0;
  --ink-dim:#b9b4c9;
  --gold:#ffc861;
  --gold-deep:#e59a2b;
  --lotus:#ff7fa9;
  --leaf:#5aa64a;
  --glass:rgba(14,18,48,.72);
  --glass-line:rgba(255,214,140,.22);
  --f-display:"Srisakdi","Charm",serif;
  --f-body:"Bai Jamjuree","Sarabun","Noto Sans Thai",system-ui,sans-serif;
  --f-wish:"Charm","Srisakdi",serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#river{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none;background:linear-gradient(180deg,rgba(5,7,26,.75),rgba(5,7,26,0))}
.top>*{pointer-events:auto}
.brand h1{margin:0;font-family:var(--f-display);font-size:clamp(26px,5vw,40px);line-height:1;color:var(--gold);text-shadow:0 0 18px rgba(255,190,90,.55)}
.brand p{margin:4px 0 0;font-size:13px;color:var(--ink-dim);letter-spacing:.02em}
.brand .count{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tool{background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:inline-flex;align-items:center;gap:6px;transition:background .2s,border-color .2s}
.tool:hover{border-color:var(--gold)}
.tool[aria-pressed="true"]{background:rgba(255,200,97,.2);border-color:var(--gold);color:var(--gold)}
.tool svg{width:15px;height:15px}

.scenes{position:fixed;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scene-row{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;padding:4px;background:rgba(6,9,30,.55);border-radius:999px;border:1px solid rgba(255,255,255,.08);max-width:100%;scrollbar-width:none}
.scene-row::-webkit-scrollbar{display:none}
.scene-chip{flex:none;border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-dim);white-space:nowrap}
.scene-chip.magic{color:#a9f0ff}
.scene-chip.magic[aria-pressed="true"]{background:linear-gradient(90deg,#9ff3ff,#d9b6ff);color:#1b0b45}
.scene-chip[aria-pressed="true"]{background:var(--ink);color:#1b1640;font-weight:700}

.cta-wrap{position:fixed;z-index:5;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:center;gap:10px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cta{pointer-events:auto;border:0;border-radius:999px;padding:14px 30px;font-size:18px;font-weight:700;color:#2a1600;background:radial-gradient(circle at 30% 20%,#fff1c4,var(--gold) 45%,var(--gold-deep));box-shadow:0 0 0 4px rgba(255,200,97,.18),0 8px 30px rgba(255,170,60,.45);animation:breathe 3.2s ease-in-out infinite}
.cta-sub{pointer-events:auto;border-radius:999px;padding:14px 18px;font-size:15px;font-weight:600}
@keyframes breathe{50%{box-shadow:0 0 0 9px rgba(255,200,97,.08),0 8px 40px rgba(255,170,60,.65)}}

.status{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);font-size:12px;color:var(--ink-dim);text-align:center;width:min(92vw,520px);pointer-events:none;text-shadow:0 1px 4px #000}
.empty{position:fixed;z-index:3;left:50%;top:58%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:min(88vw,420px)}
.empty b{display:block;font-family:var(--f-wish);font-size:26px;color:var(--gold);margin-bottom:4px}
.empty span{font-size:14px;color:var(--ink-dim)}

/* sheet */
.veil{position:fixed;inset:0;z-index:10;background:rgba(3,4,18,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{overflow-x:hidden;position:fixed;z-index:11;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,600px);max-height:92%;overflow-y:auto;background:linear-gradient(180deg,#171a46,#0d0f2c);border:1px solid var(--glass-line);border-bottom:0;border-radius:24px 24px 0 0;padding-block:18px calc(env(safe-area-inset-bottom,0px) + 22px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:rise .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rise{from{transform:translate(-50%,40px);opacity:0}}
.sheet h2{margin:0;font-family:var(--f-display);color:var(--gold);font-size:30px;line-height:1.1}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{background:transparent;border:1px solid rgba(255,255,255,.15);border-radius:50%;width:36px;height:36px;font-size:18px;flex:none}
.preview{display:block;width:100%;height:190px;margin:8px 0 4px;border-radius:16px;background:radial-gradient(ellipse at 50% 120%,#1f3a6e,#0b1030 70%)}
.step{margin-top:16px}
.step-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.type{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:14px;padding:6px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.type canvas{width:100%;height:64px}
.type b{font-size:14px}
.type small{font-size:11px;color:var(--ink-dim);line-height:1.3}
.type[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,200,97,.12);box-shadow:0 0 0 1px var(--gold) inset}
.field{display:flex;flex-direction:column;gap:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
label.l{font-size:13px;color:var(--ink-dim)}
input[type=text],textarea{width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 13px;font:inherit;font-size:16px;color:var(--ink)}
textarea{font-family:var(--f-wish);font-size:20px;line-height:1.45;min-height:88px;resize:vertical}
input::placeholder,textarea::placeholder{color:#8a86a3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid rgba(255,255,255,.16);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--lotus);border-color:var(--lotus);color:#2b0716;font-weight:700}
.swatches{display:flex;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px rgba(255,255,255,.15),0 0 14px currentColor}
.go{margin-top:20px;width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:700;color:#2a1600;background:linear-gradient(180deg,#ffe2a0,var(--gold) 50%,var(--gold-deep))}
.go:disabled{opacity:.45}
.err{color:#ff9d9d;font-size:13px;min-height:1em;margin-top:8px}
.counter{font-variant-numeric:tabular-nums}

/* cards */
.card{position:fixed;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);max-height:86%;overflow-y:auto;box-sizing:border-box;background:linear-gradient(170deg,#211b52,#0f1131 70%);border:1px solid var(--glass-line);border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(255,190,90,.12);animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.94);opacity:0}}
.card .kind{font-size:12px;color:var(--gold);letter-spacing:.08em;font-weight:700}
.card h3{margin:6px 0 2px;font-size:22px;line-height:1.25;text-wrap:balance}
.card .who2{color:var(--lotus);font-weight:600}
.card .wish{font-family:var(--f-wish);font-size:24px;line-height:1.5;margin:14px 0;color:#fff6df;white-space:pre-wrap;overflow-wrap:anywhere}
.card .meta{font-size:12px;color:var(--ink-dim)}
.card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.btn.primary{background:var(--gold);color:#2a1600;border-color:var(--gold)}
.btn.danger{border-color:#ff8f8f;color:#ffb3b3}
.siam-no{margin-top:14px;font-family:var(--f-display);font-size:54px;color:var(--gold);line-height:1;text-shadow:0 0 20px rgba(255,190,90,.5)}
.siam-level{display:inline-block;background:var(--lotus);color:#2b0716;font-weight:700;border-radius:999px;padding:3px 10px;font-size:12px;margin-top:6px}
.siam-text{font-size:18px;line-height:1.6;margin:12px 0 0}

/* list drawer */
.drawer{position:fixed;z-index:9;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 92px);width:min(86vw,320px);max-height:52%;overflow-y:auto;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-line);border-radius:18px;padding:12px}
.drawer h4{margin:2px 4px 8px;font-size:14px;color:var(--gold)}
.li{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid rgba(255,255,255,.07);padding:9px 6px}
.li b{display:block;font-size:14px;overflow-wrap:anywhere}
.li span{display:block;font-family:var(--f-wish);font-size:16px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.mine b::after{content:" · ของคุณ";color:var(--gold);font-weight:600;font-size:12px}

.toast{position:fixed;z-index:20;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);background:rgba(255,246,223,.95);color:#2a1a3a;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:88vw;text-align:center;animation:pop2 .25s ease-out}
@keyframes pop2{from{opacity:0;transform:translate(-50%,-8px)}}
@media (prefers-reduced-motion:reduce){.cta{animation:none}.sheet,.card,.toast{animation:none}}

.photo-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.crop{width:160px;height:160px;border-radius:50%;overflow:hidden;flex:none;position:relative;box-shadow:0 0 0 4px #e7b24a,0 0 0 7px rgba(255,220,150,.25),0 8px 24px rgba(0,0,0,.4);background:rgba(255,255,255,.04)}
.crop canvas{width:160px;height:160px;display:block;cursor:pointer;touch-action:none}
.crop.has canvas{cursor:grab}
.photo-ctl{display:flex;flex-direction:column;gap:8px;flex:1 1 150px;min-width:0}
.photo-ctl input[type=range]{width:100%;accent-color:var(--gold)}
.photo-ctl input[type=range]:disabled{opacity:.35}
.file-btn{text-align:center;cursor:pointer;display:block}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.hint{font-size:12px;color:var(--ink-dim);line-height:1.4}
.card-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.kphoto{width:86px;height:86px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 3px #e7b24a,0 0 0 6px rgba(255,220,150,.22)}
.btn.ghost{background:transparent;color:var(--ink-dim);border-color:rgba(255,255,255,.12)}
.li{display:flex!important;gap:10px;align-items:center}
.li-text{min-width:0;flex:1}
.li-photo{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px #e7b24a}
.siam-no{margin-top:14px}
</style>
</head>
<body>

<canvas id="river" aria-label="แม่น้ำยามค่ำคืน แตะกระทงเพื่ออ่านคำอธิษฐาน แตะท้องฟ้าเพื่อปล่อยโคมลอย"></canvas>

<header class="top">
  <div class="brand">
    <h1>ลอยกระทงออนไลน์</h1>
    <p>คืนเพ็ญเดือนสิบสอง · กระทงในแม่น้ำ <span class="count" id="count">0</span> ใบ</p>
  </div>
  <div class="tools">
    <button class="tool" id="btnSound" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>เสียง</button>
    <button class="tool" id="btnFire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg>จุดพลุ</button>
    <button class="tool" id="btnLantern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4h10l2 13H5L7 4z"/><path d="M10 21h4"/></svg>ปล่อยโคม</button>
    <button class="tool" id="btnList" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>รายชื่อ</button>
  </div>
</header>

<div class="empty" id="empty" hidden><b>แม่น้ำยังว่างอยู่</b><span>กด “ลอยกระทง” แล้วเป็นคนแรกที่ส่งคำอธิษฐานลงน้ำคืนนี้</span></div>
<div class="status" id="status">กำลังเชื่อมต่อแม่น้ำ…</div>

<nav class="scenes" aria-label="เลือกแม่น้ำ"><div class="scene-row" id="sceneRow"></div></nav>

<div class="cta-wrap"><button class="cta" id="btnOpen">ลอยกระทง</button></div>

<aside class="drawer" id="drawer" hidden aria-label="กระทงในแม่น้ำ"><h4>กระทงที่ลอยอยู่</h4><div id="listBody"></div></aside>

<div class="veil" id="veil" hidden></div>

<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><h2 id="sheetTitle">ทำกระทงของคุณ</h2><button class="x" id="btnClose" aria-label="ปิด">✕</button></div>
  <canvas class="preview" id="preview" aria-hidden="true"></canvas>

  <div class="step"><div class="step-label"><span>1 · เลือกกระทง</span></div><div class="types" id="types"></div></div>

  <div class="step row2">
    <div class="field"><label class="l" for="inName">ชื่อคุณ</label><input type="text" id="inName" maxlength="30" placeholder="ชื่อเล่นของคุณ" autocomplete="nickname"></div>
    <div class="field"><label class="l" for="inPartner">ลอยคู่กับ (ไม่ใส่ก็ได้)</label><input type="text" id="inPartner" maxlength="30" placeholder="ชื่อคนพิเศษ"></div>
  </div>

  <div class="step field">
    <div class="step-label"><span>2 · คำอธิษฐาน</span><span class="counter" id="wishCount">0/160</span></div>
    <textarea id="inWish" maxlength="160" placeholder="ขอให้ปีหน้ามีความสุข สุขภาพแข็งแรง และได้เจอคนที่ใช่…"></textarea>
    <div class="chips" id="cats" style="margin-top:6px"></div>
  </div>

  <div class="step"><div class="step-label"><span>3 · สีเทียน</span></div><div class="swatches" id="candles"></div></div>

  <div class="step"><div class="step-label"><span>4 · รูปเล็กๆ บนกระทง</span><span>ไม่ใส่ก็ได้</span></div>
    <div class="photo-row">
      <div class="crop" id="crop"><canvas id="cropCv" width="160" height="160" aria-label="พื้นที่จัดรูป ลากเพื่อเลื่อนรูป"></canvas></div>
      <div class="photo-ctl">
        <label class="btn primary file-btn" for="inPhoto">เลือกรูป</label>
        <input type="file" id="inPhoto" accept="image/*" class="sr-file">
        <label class="l" for="zoom">ซูม</label>
        <input type="range" id="zoom" min="1" max="4" step="0.01" value="1">
        <button class="btn" type="button" id="btnNoPhoto" hidden>เอารูปออก</button>
        <small id="cropHint" class="hint"></small>
      </div>
    </div>
  </div>

  <div class="err" id="err" role="alert"></div>
  <button class="go" id="btnGo">อธิษฐานแล้ว ลอยเลย</button>
</section>

<section class="card" id="card" hidden role="dialog" aria-modal="true"></section>

<script>
(() => {
"use strict";
const API = "/api/krathongs";

/* ================= data ================= */
const TYPES = [
  {id:"banana", name:"กระทงใบตอง", desc:"คลาสสิก พับกลีบบายศรี"},
  {id:"lotus", name:"กระทงดอกบัว", desc:"กลีบชมพูซ้อนสามชั้น"},
  {id:"bread", name:"กระทงขนมปัง", desc:"ปลามากินด้วย รักษ์น้ำ"},
  {id:"coconut", name:"กระทงกะลา", desc:"ทนทาน ลอยได้ไกล"},
  {id:"pride", name:"กระทงสายรุ้ง", desc:"รักคือรัก ลอยให้สุด"},
  {id:"cat", name:"กระทงน้องแมว", desc:"หูตั้ง หนวดเฟี้ยว"},
  {id:"star", name:"กระทงดวงดาว", desc:"คริสตัลเรืองแสง"}
];
const TYPE_BY = Object.fromEntries(TYPES.map(t=>[t.id,t]));
const CATS = [
  {id:"love",name:"ความรัก"},{id:"work",name:"การงาน"},{id:"money",name:"การเงิน"},
  {id:"health",name:"สุขภาพ"},{id:"study",name:"การเรียน"},{id:"sorry",name:"ขอขมาแม่คงคา"}
];
const CAT_BY = Object.fromEntries(CATS.map(c=>[c.id,c]));
const CANDLES = [
  {id:"white",c:"#fff3d6",d:"#d9c6a0",n:"ขาว"},{id:"gold",c:"#ffd36a",d:"#c48a1c",n:"ทอง"},{id:"pink",c:"#ff9cc0",d:"#c9537f",n:"ชมพู"},
  {id:"blue",c:"#9fdcff",d:"#4a8fc4",n:"ฟ้า"},{id:"violet",c:"#cfadff",d:"#7f56c9",n:"ม่วง"}

function mulberry(seed){ let a = seed>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* image cache for krathong photos */
const imgCache = new Map();
function getImg(url){
  if(!url) return null;
  let e = imgCache.get(url);
  if(!e){ const im = new Image(); im.decoding = "async"; e = {im, ok:false}; im.onload = () => { e.ok = true; }; im.src = url; imgCache.set(url, e); }
  return e.ok ? e.im : null;
}

/* ================= krathong drawing ================= */
function petal(c,bx,by,tx,ty,w,base,tip,edge,vein){
  const dx=tx-bx, dy=ty-by, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
  c.beginPath();
  c.moveTo(bx+nx*w, by+ny*w);
  c.quadraticCurveTo(bx+dx*.5+nx*w*1.2, by+dy*.5+ny*w*1.2, tx, ty);
  c.quadraticCurveTo(bx+dx*.5-nx*w*1.2, by+dy*.5-ny*w*1.2, bx-nx*w, by-ny*w);
  c.closePath();
  c.fillStyle = tip ? lg(c,bx,by,tx,ty,[[0,base],[1,tip]]) : base;
  c.fill();
  if(edge){ c.strokeStyle=edge; c.lineWidth=Math.max(.5,w*.1); c.stroke(); }
  if(vein){ c.strokeStyle=vein; c.lineWidth=Math.max(.35,w*.07); c.beginPath(); c.moveTo(bx,by); c.lineTo(bx+dx*.82,by+dy*.82); c.stroke(); }
}
function ring(c,s,o,front){
  const items=[];
  for(let i=0;i<o.n;i++){ const a=(i/o.n)*TAU+(o.off||0); items.push({a,i,sn:Math.sin(a)}); }
  items.sort((p,q)=>p.sn-q.sn);
  for(const it of items){
    if(front ? it.sn<0 : it.sn>=0) continue;
    const ca=Math.cos(it.a), sa=it.sn, y0=(o.y||0)*s;
    const bx=ca*o.rx*s, by=sa*o.ry*s+y0;
    const tx=ca*o.rx*o.out*s, ty=sa*o.ry*o.out*s-o.up*s+y0;
    const [b,t]=o.col(it.i,sa);
    petal(c,bx,by,tx,ty,o.w*s,b,t,o.edge,o.vein);
  }
}
function marigold(c,x,y,r,c1,c2){
  for(let layer=0;layer<3;layer++){
    const rr=r*(1-layer*.27); c.fillStyle = layer===1 ? c2 : c1;
    const n=11-layer*3;
    for(let i=0;i<n;i++){ const a=i/n*TAU+layer*.35; c.beginPath(); c.ellipse(x+Math.cos(a)*rr*.5,y+Math.sin(a)*rr*.38,rr*.34,rr*.26,a,0,TAU); c.fill(); }
  }
  c.fillStyle="rgba(110,40,0,.55)"; c.beginPath(); c.arc(x,y,r*.14,0,TAU); c.fill();
}
function jasmine(c,x,y,r){
  c.fillStyle="#fffdf6";
  for(let i=0;i<5;i++){ const a=i/5*TAU-Math.PI/2; c.beginPath(); c.ellipse(x+Math.cos(a)*r*.48,y+Math.sin(a)*r*.36,r*.36,r*.2,a,0,TAU); c.fill(); }
  c.fillStyle="#f1dc6a"; c.beginPath(); c.arc(x,y,r*.13,0,TAU); c.fill();
}
function rose(c,x,y,r,col,dark){
  c.fillStyle=rg(c,x-r*.3,y-r*.3,0,r*1.1,[[0,col],[1,dark]]); c.beginPath(); c.ellipse(x,y,r,r*.82,0,0,TAU); c.fill();
  c.strokeStyle="rgba(0,0,0,.22)"; c.lineWidth=Math.max(.4,r*.1);
  for(let i=0;i<3;i++){ c.beginPath(); c.arc(x+(i-1)*r*.1,y-i*r*.05,r*(.72-i*.2),Math.PI*(.85+i*.35),Math.PI*(2.05+i*.35)); c.stroke(); }
}
function bud(c,x,y,r){ petal(c,x,y+r*.2,x,y-r*1.3,r*.5,"#ffe6ef","#ff5f97","rgba(255,255,255,.5)"); petal(c,x,y+r*.2,x-r*.7,y-r*.8,r*.3,"#ffd3e2","#ff7aa8"); petal(c,x,y+r*.2,x+r*.7,y-r*.8,r*.3,"#ffd3e2","#ff7aa8"); }
function gem(c,x,y,r,col){
  c.fillStyle=lg(c,x-r,y-r,x+r,y+r,[[0,"#fff"],[.4,col],[1,"#2a1660"]]);
  c.beginPath(); c.moveTo(x,y-r); c.lineTo(x+r*.75,y); c.lineTo(x,y+r); c.lineTo(x-r*.75,y); c.closePath(); c.fill();
  c.fillStyle="rgba(255,255,255,.8)"; c.beginPath(); c.arc(x-r*.18,y-r*.32,r*.17,0,TAU); c.fill();
}
function bodyShape(c,s,h,rb){
  c.beginPath();
  c.moveTo(-s,0); c.lineTo(-s*rb,h*s);
  c.ellipse(0,h*s,s*rb,s*.28,0,Math.PI,0,true);
  c.lineTo(s,0); c.ellipse(0,0,s,s*.36,0,0,Math.PI,false); c.closePath();
}
function body(c,s,top,mid,bot,h,rb){
  rb=rb||.82;
  bodyShape(c,s,h,rb);
  c.fillStyle=lg(c,-s,0,s,0,[[0,bot],[.3,mid],[.55,top],[1,bot]]); c.fill();
  // vertical shading for volume
  c.save(); bodyShape(c,s,h,rb); c.clip();
  c.fillStyle=lg(c,0,0,0,h*s+s*.3,[[0,"rgba(255,255,255,.08)"],[1,"rgba(0,0,0,.35)"]]); c.fillRect(-s,0,2*s,h*s+s*.3);
  c.restore();
}
function baiSi(c,s,y,n,colA,colB,edge){
  // folded triangular banana-leaf points along the front rim
  for(let i=0;i<n;i++){
    const a=Math.PI*(i+.5)/n, x=-Math.cos(a)*s*.92, yy=Math.sin(a)*s*.33+y;
    const w=.085*s, h=.24*s;
    c.beginPath(); c.moveTo(x-w,yy); c.lineTo(x,yy+h); c.lineTo(x+w,yy); c.closePath();
    c.fillStyle=lg(c,x,yy,x,yy+h,[[0,colA],[1,colB]]); c.fill();
    c.strokeStyle=edge; c.lineWidth=Math.max(.4,.012*s); c.stroke();
    c.beginPath(); c.moveTo(x,yy); c.lineTo(x,yy+h*.8); c.strokeStyle="rgba(0,0,0,.18)"; c.stroke();
    c.fillStyle="#fffbe8"; c.beginPath(); c.arc(x,yy+h*.18,Math.max(.4,.014*s),0,TAU); c.fill();
  }
}
function rimEllipse(c,s,col,edge,rx,ry){
  c.fillStyle=col; c.beginPath(); c.ellipse(0,0,s*(rx||1),s*(ry||.36),0,0,TAU); c.fill();
  if(edge){ c.strokeStyle=edge; c.lineWidth=Math.max(.5,.025*s); c.stroke(); }
}

const RAINBOW=["#ff4d4d","#ff9a2e","#ffe04a","#4fcf63","#3f9bff","#9b5cff"];
function ringsFor(type){
  const R=[];
  const leaf=(i,sa)=>sa<0?["#1f5e1c","#4f9c40"]:["#2f7a29","#78c45f"];
  if(type==="banana") R.push({n:11,rx:.95,ry:.34,out:1.2,up:.66,w:.15,col:leaf,edge:"rgba(190,240,160,.55)",vein:"rgba(255,255,255,.22)"});
  if(type==="cat") R.push({n:8,rx:.95,ry:.34,out:1.12,up:.42,w:.14,col:leaf,edge:"rgba(190,240,160,.55)",vein:"rgba(255,255,255,.22)",off:.2});
  if(type==="pride") R.push({n:12,rx:.95,ry:.34,out:1.22,up:.68,w:.15,col:(i,sa)=>[sa<0?"#ffffff":"#fff7f0",RAINBOW[i%6]],edge:"rgba(255,255,255,.7)",vein:"rgba(255,255,255,.35)"});
  if(type==="lotus"){
    R.push({n:12,rx:.95,ry:.32,out:1.22,up:.36,w:.2,col:(i,sa)=>[sa<0?"#f7c9d8":"#fff0f5",sa<0?"#d9467d":"#ff6f9f"],edge:"rgba(255,230,240,.8)",vein:"rgba(200,60,110,.25)",y:.06});
    R.push({n:10,rx:.7,ry:.25,out:1.25,up:.62,w:.17,col:(i,sa)=>[sa<0?"#f9d2e0":"#fff4f8",sa<0?"#e0558a":"#ff86ad"],edge:"rgba(255,235,243,.85)",vein:"rgba(200,60,110,.22)",off:.3});
    R.push({n:8,rx:.4,ry:.15,out:1.3,up:.82,w:.14,col:(i,sa)=>["#fffafc",sa<0?"#ef6c9a":"#ffa3c1"],edge:"#fff",vein:"rgba(200,60,110,.2)",off:.1});
  }
  if(type==="coconut") R.push({n:7,rx:.85,ry:.3,out:1.28,up:.52,w:.12,col:leaf,edge:"rgba(190,240,160,.5)",vein:"rgba(255,255,255,.2)"});
  if(type==="star") R.push({n:10,rx:.95,ry:.34,out:1.26,up:.72,w:.11,col:(i,sa)=>[i%2?"rgba(120,220,255,.85)":"rgba(190,160,255,.85)","rgba(255,255,255,.95)"],edge:"rgba(255,255,255,.9)",vein:"rgba(255,255,255,.5)"});
  return R;
}

function krBase(c,k,s){
  const type=k.type;
  if(type==="banana"||type==="cat"||type==="pride"){
    const pride=type==="pride";
    const h = type==="cat" ? .42 : .3;
    body(c,s, pride?"#ffffff":"#4f9a40", pride?"#e9e4fb":"#3b7f31", pride?"#a9a0d4":"#173f14", h);
    // leaf veins
    c.save(); bodyShape(c,s,h,.82); c.clip(); c.strokeStyle= pride?"rgba(150,130,210,.25)":"rgba(200,255,170,.14)"; c.lineWidth=Math.max(.4,.012*s);
    for(let i=-7;i<=7;i++){ const x=i*.13*s; const y0=.36*s*Math.sqrt(Math.max(0,1-(x/s)**2)); c.beginPath(); c.moveTo(x,y0); c.lineTo(x*.82,h*s+.28*s*Math.sqrt(Math.max(0,1-(x/(s*.82))**2))); c.stroke(); }
    c.restore();
    if(pride){
      for(let i=0;i<12;i++){ const a=Math.PI*(i+.5)/12, x=-Math.cos(a)*s*.92, yy=Math.sin(a)*s*.33+.02*s; const col=RAINBOW[i%6];
        c.beginPath(); c.moveTo(x-.085*s,yy); c.lineTo(x,yy+.24*s); c.lineTo(x+.085*s,yy); c.closePath(); c.fillStyle=lg(c,x,yy,x,yy+.24*s,[[0,"#fff"],[1,col]]); c.fill(); }
    } else baiSi(c,s,.02*s,12,"#8ad070","#2f6f27","rgba(220,255,200,.6)");
    rimEllipse(c,s, pride?"#fbf9ff":"#5ea94d", pride?"rgba(170,150,230,.6)":"rgba(200,250,170,.5)");
  } else if(type==="lotus"){
    c.fillStyle=rg(c,0,.12*s,0,1.2*s,[[0,"#4d9a45"],[1,"#24561f"]]); c.beginPath(); c.ellipse(0,.12*s,1.18*s,.42*s,0,0,TAU); c.fill();
    c.strokeStyle="rgba(190,240,160,.25)"; c.lineWidth=Math.max(.4,.012*s);
    for(let i=0;i<16;i++){ const a=i/16*TAU; c.beginPath(); c.moveTo(0,.12*s); c.lineTo(Math.cos(a)*1.15*s,.12*s+Math.sin(a)*.41*s); c.stroke(); }
    c.fillStyle="#64b257"; c.beginPath(); c.ellipse(0,.08*s,1.0*s,.33*s,0,0,TAU); c.fill();
  } else if(type==="bread"){
    body(c,s,"#f2c07a","#d99a4f","#7d4718",.28);
    c.strokeStyle="rgba(90,45,10,.35)"; c.lineWidth=Math.max(.5,.02*s);
    for(let i=0;i<7;i++){ const x=(-.6+i*.2)*s; c.beginPath(); c.moveTo(x-.04*s,.42*s); c.lineTo(x+.05*s,.3*s); c.stroke(); }
    for(let i=0;i<16;i++){ const a=i/16*TAU; const x=Math.cos(a)*s*.92, y=Math.sin(a)*s*.33;
      c.fillStyle=rg(c,x-.04*s,y-.05*s,0,.15*s,[[0,"#ffe0a8"],[.6,"#eab26a"],[1,"#b87a36"]]); c.beginPath(); c.arc(x,y,.14*s,0,TAU); c.fill(); }
    c.fillStyle=rg(c,0,0,0,s,[[0,"#ffe4b0"],[1,"#e9b874"]]); c.beginPath(); c.ellipse(0,0,s*.88,s*.31,0,0,TAU); c.fill();
    const R=mulberry(77); c.fillStyle="#fff7e0"; for(let i=0;i<14;i++){ c.beginPath(); c.ellipse((R()-.5)*1.4*s,(R()-.5)*.4*s,.025*s,.012*s,R()*3,0,TAU); c.fill(); }
  } else if(type==="coconut"){
    body(c,s*.95,"#9a6a42","#7a4d2a","#2e1a0c",.4);
    c.strokeStyle="rgba(25,12,4,.4)"; c.lineWidth=Math.max(.4,.014*s);
    const R=mulberry(31);
    for(let i=0;i<28;i++){ const x=(R()-.5)*1.7*s; c.beginPath(); c.moveTo(x,.1*s+R()*.1*s); c.quadraticCurveTo(x+(R()-.5)*.1*s,.3*s,x*.88,.45*s+R()*.1*s); c.stroke(); }
    rimEllipse(c,s,"#fbf3e2",null,.95,.34);
    c.fillStyle=rg(c,0,.04*s,0,.8*s,[[0,"#5a3a20"],[1,"#2d1a0b"]]); c.beginPath(); c.ellipse(0,.02*s,s*.82,s*.27,0,0,TAU); c.fill();
  } else if(type==="star"){
    body(c,s,"#4b39a8","#33237e","#0d0730",.3);
    const R=mulberry(9); for(let i=0;i<26;i++){ const x=(R()-.5)*1.7*s, y=.08*s+R()*.42*s; c.fillStyle=R()<.5?"#ffd86a":"#bfeaff"; c.beginPath(); c.arc(x,y,Math.max(.4,.016*s),0,TAU); c.fill(); }
    rimEllipse(c,s,"#6750d0","rgba(200,230,255,.6)");
  }
  if(type==="cat"){
    for(const sx of [-1,1]){
      c.fillStyle=lg(c,sx*.6*s,-1*s,sx*.6*s,0,[[0,"#7cc566"],[1,"#245c1f"]]);
      c.beginPath(); c.moveTo(sx*.22*s,-.1*s); c.lineTo(sx*.62*s,-1.02*s); c.lineTo(sx*.88*s,-.05*s); c.closePath(); c.fill();
      c.fillStyle=lg(c,0,-.8*s,0,0,[[0,"#ffc2d7"],[1,"#ff7fa8"]]);
      c.beginPath(); c.moveTo(sx*.37*s,-.15*s); c.lineTo(sx*.62*s,-.78*s); c.lineTo(sx*.75*s,-.12*s); c.closePath(); c.fill();
    }
  }
}

function krCluster(c,k,s,variant){
  const type=k.type, R=mulberry(1234+variant*97+type.length*13);
  c.fillStyle = type==="star" ? rg(c,0,-.1*s,0,.6*s,[[0,"#3a2a80"],[1,"#1b1250"]]) : rg(c,0,-.1*s,0,.6*s,[[0,"#4d8a3a"],[1,"#24501b"]]);

function drawNaga(c,t,k){

    c.fillStyle=lg(c,bx,by,bx,by-hh,[[0,"#c98a1c"],[1,"#fff0b0"]]); c.beginPath(); c.moveTo(bx-s*.1,by); c.quadraticCurveTo(bx-s*.12,by-hh*.6,bx-s*.02,by-hh); c.quadraticCurveTo(bx+s*.02,by-hh*.5,bx+s*.1,by); c.fill(); }

function laneY(l){ const top=HOR+Math.max(18,H*.04), bot=H-Math.max(150,H*.2); return top+l*Math.max(40,bot-top); }
function unit(){ return Math.max(16,Math.min(46,Math.min(W,H)*.07)); }
function depthScale(y){ return .35+Math.max(0,(y-HOR)/(H-HOR))*1.1; }
function kPos(k,t,now){
  const period = 120+(k.seed||.5)*90;
  const el = (now-(k.createdAt||now))/1000;
  const p = frac(el/period + .42);
  const x = -.1*W + p*1.2*W;
  const l = k.lane ?? .5;
  const s = unit()*(.42+l*.8);
  let y = laneY(l) + Math.sin(t*1.3+(k.seed||0)*20)*.08*s;
  let drop = 0;
  if(el<2.2 && el>=0){ drop = 1-el/2.2; y += -drop*drop*H*.35; }
  return {x,y,s,rot:Math.sin(t*.9+(k.seed||0)*7)*.05,drop};
}

    type:TYPE_BY[d.type]?d.type:"banana", cat:CAT_BY[d.cat]?d.cat:"", candle:CANDLE_BY[d.candle]?d.candle:"white",
    lane:Math.min(1,Math.max(0,+d.lane||.5)), seed:Math.min(1,Math.max(0,+d.seed||.5)), createdAt:+d.createdAt||Date.now()};

  const lfo=AC.createOscillator(); lfo.frequency.value=.12; const lgn=AC.createGain(); lgn.gain.value=200; lfo.connect(lgn); lgn.connect(f.frequency); lfo.start();

const PENTA=[261.6,293.7,329.6,392,440,523.3,587.3,659.3,784,880];
function tone(freq,when,dur,vol,type){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||"sine"; o.frequency.value=freq; g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(vol,when+.01); g.gain.exponentialRampToValueAtTime(.0001,when+dur); o.connect(g); g.connect(master); o.start(when); o.stop(when+dur+.05); }
function sfx(kind,soft){
  if(!ambOn||!AC) return; const n=AC.currentTime;
  if(kind==="chime"){ const f=PENTA[Math.random()*PENTA.length|0]; tone(f,n,1.6,soft?.06:.12,"triangle"); tone(f*2,n,.8,soft?.02:.04); tone(f,n+.32,1.2,soft?.025:.05,"triangle"); }
  else if(kind==="drop"){ const o=AC.createOscillator(),g=AC.createGain(); o.frequency.setValueAtTime(900,n); o.frequency.exponentialRampToValueAtTime(240,n+.18); g.gain.setValueAtTime(.12,n); g.gain.exponentialRampToValueAtTime(.0001,n+.25); o.connect(g); g.connect(master); o.start(n); o.stop(n+.3); }
  else if(kind==="splash"){ const s=AC.createBufferSource(); s.buffer=noiseBuf(.6); const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1200; const g=AC.createGain(); g.gain.setValueAtTime(.25,n); g.gain.exponentialRampToValueAtTime(.0001,n+.55); s.connect(f); f.connect(g); g.connect(master); s.start(n); [0,2,4,7].forEach((i,j)=>tone(PENTA[i+2],n+.15+j*.12,1.4,.08,"triangle")); }
  else if(kind==="whistle"){ const o=AC.createOscillator(),g=AC.createGain(); o.frequency.setValueAtTime(600,n); o.frequency.exponentialRampToValueAtTime(1800,n+.9); g.gain.setValueAtTime(.02,n); g.gain.linearRampToValueAtTime(0,n+.9); o.connect(g); g.connect(master); o.start(n); o.stop(n+1); }
  else if(kind==="boom"){ const s=AC.createBufferSource(); s.buffer=noiseBuf(1.5,true); const f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=300; const g=AC.createGain(); g.gain.setValueAtTime(.9,n); g.gain.exponentialRampToValueAtTime(.0001,n+1.4); s.connect(f); f.connect(g); g.connect(master); s.start(n);
    const s2=AC.createBufferSource(); s2.buffer=noiseBuf(1); const f2=AC.createBiquadFilter(); f2.type="highpass"; f2.frequency.value=3000; const g2=AC.createGain(); g2.gain.setValueAtTime(0,n); g2.gain.linearRampToValueAtTime(.06,n+.2); g2.gain.exponentialRampToValueAtTime(.0001,n+1); s2.connect(f2); f2.connect(g2); g2.connect(master); s2.start(n); }
  else if(kind==="bless"){ [0,2,4,5,7,9].forEach((i,j)=>tone(PENTA[i],n+j*.08,1.2,.09,"triangle")); }
}

/* ---- photo cropper ---- */
const crop={img:null,zoom:1,ox:0,oy:0}, CROP=160, OUT=192;
const cropCv=$("cropCv"), zoomEl=$("zoom");
function cropBase(){ return CROP/Math.min(crop.img.width,crop.img.height); }
function clampCrop(){ if(!crop.img) return; const sc=cropBase()*crop.zoom; const mx=Math.max(0,(crop.img.width*sc-CROP)/2), my=Math.max(0,(crop.img.height*sc-CROP)/2); crop.ox=Math.max(-mx,Math.min(mx,crop.ox)); crop.oy=Math.max(-my,Math.min(my,crop.oy)); }
function renderCrop(c,size){ const k=size/CROP, sc=cropBase()*crop.zoom*k, w=crop.img.width*sc, h=crop.img.height*sc; c.drawImage(crop.img,size/2-w/2+crop.ox*k,size/2-h/2+crop.oy*k,w,h); }
function drawCropView(){
  const d=Math.min(2,devicePixelRatio||1); cropCv.width=CROP*d; cropCv.height=CROP*d;
  const c=cropCv.getContext("2d"); c.setTransform(d,0,0,d,0,0); c.clearRect(0,0,CROP,CROP);
  if(!crop.img){ c.fillStyle="rgba(255,255,255,.05)"; c.fillRect(0,0,CROP,CROP); c.fillStyle="#9b97b8"; c.font='500 13px "Bai Jamjuree",sans-serif'; c.textAlign="center"; c.fillText("ยังไม่มีรูป",CROP/2,CROP/2+4); return; }
  renderCrop(c,CROP);
}
let commitT=0;
function commitCrop(){ clearTimeout(commitT); commitT=setTimeout(()=>{ if(!crop.img) return; const o=document.createElement("canvas"); o.width=o.height=OUT; const c=o.getContext("2d"); c.fillStyle="#fff"; c.fillRect(0,0,OUT,OUT); renderCrop(c,OUT); form.photo=o.toDataURL("image/jpeg",.84); const im=new Image(); im.onload=()=>{ form.photoImg=im; }; im.src=form.photo; },120); }
function setPhotoUI(){ const has=!!crop.img; zoomEl.disabled=!has; $("btnNoPhoto").hidden=!has; $("cropHint").textContent = has ? "ลากรูปเพื่อจัดตำแหน่ง เลื่อนแถบเพื่อซูม" : "รูปหน้าคุณ คนรัก หรือน้องหมาน้องแมว ก็ได้"; $("crop").classList.toggle("has",has); }
$("inPhoto").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
  if(f.size>20*1024*1024){ $("err").textContent="รูปใหญ่เกินไป เลือกรูปที่เล็กกว่า 20MB นะ"; return; }
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{ const m=1200/Math.max(im.width,im.height), sc=Math.min(1,m); const o=document.createElement("canvas"); o.width=Math.round(im.width*sc); o.height=Math.round(im.height*sc); o.getContext("2d").drawImage(im,0,0,o.width,o.height); URL.revokeObjectURL(url);
    crop.img=o; crop.zoom=1; crop.ox=0; crop.oy=0; zoomEl.value=1; setPhotoUI(); drawCropView(); commitCrop(); $("err").textContent=""; };
  im.onerror=()=>{ URL.revokeObjectURL(url); $("err").textContent="เปิดรูปนี้ไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG นะ"; };
  im.src=url;
});
zoomEl.addEventListener("input",()=>{ crop.zoom=+zoomEl.value; clampCrop(); drawCropView(); commitCrop(); });
$("btnNoPhoto").addEventListener("click",()=>{ crop.img=null; form.photo=null; form.photoImg=null; setPhotoUI(); drawCropView(); });
let drag=null;
cropCv.addEventListener("pointerdown",e=>{ if(!crop.img) { $("inPhoto").click(); return; } drag={x:e.clientX,y:e.clientY,ox:crop.ox,oy:crop.oy}; cropCv.setPointerCapture(e.pointerId); });
cropCv.addEventListener("pointermove",e=>{ if(!drag) return; crop.ox=drag.ox+(e.clientX-drag.x); crop.oy=drag.oy+(e.clientY-drag.y); clampCrop(); drawCropView(); });
const endDrag=()=>{ if(drag){ drag=null; commitCrop(); } };
cropCv.addEventListener("pointerup",endDrag); cropCv.addEventListener("pointercancel",endDrag);
cropCv.addEventListener("wheel",e=>{ if(!crop.img) return; e.preventDefault(); crop.zoom=Math.max(1,Math.min(4,crop.zoom*(e.deltaY<0?1.08:.93))); zoomEl.value=crop.zoom; clampCrop(); drawCropView(); commitCrop(); },{passive:false});

function previewLoop(){
  const t=performance.now()/1000;
  const pc=$("preview"); const r=pc.getBoundingClientRect(); const d=Math.min(2,devicePixelRatio||1);
  if(pc.width!==Math.round(r.width*d)){ pc.width=Math.round(r.width*d); pc.height=Math.round(r.height*d); }
  const c=pc.getContext("2d"); c.setTransform(d,0,0,d,0,0); c.clearRect(0,0,r.width,r.height);
  for(let i=0;i<16;i++){ c.fillStyle=`rgba(170,200,255,${.05+.06*Math.sin(t*1.2+i)})`; c.fillRect((i*67+t*12)%(r.width+60)-40,r.height*.6+i*5,60+i*4,1); }
  const k={type:form.type,candle:form.candle,seed:.37};
  const s=Math.min(54,r.height*.27);
  c.save(); c.translate(r.width/2,r.height*.64+Math.sin(t*1.3)*2.5);
  c.save(); c.translate(0,.3*s); c.scale(1,-.45); c.translate(0,-.3*s); c.globalAlpha=.22; krStatic(c,k,s,1); c.restore();
  drawGlow(c,k,s,1); c.rotate(Math.sin(t*.9)*.04); krFull(c,k,s,t,form.photoImg); c.restore();
  const nm=$("inName").value.trim(), pt=$("inPartner").value.trim();
  if(nm){ c.font='600 14px "Bai Jamjuree",sans-serif'; c.textAlign="center"; c.fillStyle="#fff3dc"; c.fillText(pt?`${nm} ♥ ${pt}`:nm, r.width/2, 22, r.width-20); }
  for(const tc of typeCanvases){ const rr=tc.cvs.getBoundingClientRect(); if(!rr.width) continue; if(tc.cvs.width!==Math.round(rr.width*d)){ tc.cvs.width=Math.round(rr.width*d); tc.cvs.height=Math.round(rr.height*d); }
    const x=tc.cvs.getContext("2d"); x.setTransform(d,0,0,d,0,0); x.clearRect(0,0,rr.width,rr.height); x.save(); x.translate(rr.width/2,rr.height*.68+Math.sin(t*1.6+tc.id.length)*1.5); krFull(x,{type:tc.id,candle:form.candle,seed:tc.id.length/10},Math.min(22,rr.height*.3),t,null); x.restore(); }
  if(sheetOpen) previewRAF=requestAnimationFrame(previewLoop);
}

function copyWish(k,f,btn){
  const tp=(TYPE_BY[k.type]||TYPES[0]).name;
  const txt=`ฉันลอย${tp}ออนไลน์คืนวันเพ็ญ 🌕\n“${k.wish}”\n— ${k.partner?k.name+" ♥ "+k.partner:k.name}\nเซียมซีแม่คงคา: ${f[1]}\n${location.origin}`;
  const done=()=>{ btn.textContent="คัดลอกแล้ว"; };
  try{ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,btn)); }catch(e){ fallbackCopy(txt,btn); }
}
function fallbackCopy(txt,btn){ const ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly",""); ta.style.cssText="width:100%;margin-top:10px;font-size:14px;min-height:96px"; btn.closest(".card").append(ta); ta.focus(); ta.select(); btn.textContent="เลือกข้อความแล้ว กดคัดลอกได้เลย"; }

/* ---- share card image ---- */
function wrapLines(c,text,maxW){ const out=[]; let line=""; for(const ch of Array.from(text)){ const tst=line+ch; if(c.measureText(tst).width>maxW && line){ out.push(line); line=ch; } else line=tst; } if(line) out.push(line); return out; }
async function saveCard(k,fortune){
  const Wc=1080,Hc=1350, cv2=document.createElement("canvas"); cv2.width=Wc; cv2.height=Hc; const c=cv2.getContext("2d");
  c.fillStyle=lg(c,0,0,0,Hc,[[0,"#04061a"],[.45,"#1e1a56"],[.46,"#0e1a4a"],[1,"#03060f"]]); c.fillRect(0,0,Wc,Hc);
  const R=mulberry(7); for(let i=0;i<260;i++){ c.fillStyle=`rgba(255,250,235,${R()*.8})`; const r=R()*2.6; c.fillRect(R()*Wc,R()*Hc*.44,r,r); }
  const mx=840,my=200,mr=86; c.fillStyle=rg(c,mx,my,mr,mr*6,[[0,"rgba(255,240,200,.3)"],[1,"rgba(255,240,200,0)"]]); c.fillRect(0,0,Wc,Hc*.46);
  c.fillStyle=rg(c,mx-30,my-30,10,mr,[[0,"#fffdf0"],[1,"#f1c97a"]],mx,my); c.beginPath(); c.arc(mx,my,mr,0,TAU); c.fill();
  for(let i=0;i<44;i++){ const y=Hc*.46+i*16; const w=mr*(.7+i*.06)*(.6+.4*Math.sin(i*1.7)); c.fillStyle=`rgba(255,236,180,${.3*(1-i/48)})`; c.fillRect(mx-w/2+Math.sin(i)*10,y,w,3); }
  const CB=(BACKDROPS[scene]&&BACKDROPS[scene].ok)?BACKDROPS[scene]:BACKDROPS[0];
  if(CB.ok){ const f=coverFit(CB,Wc,Hc,.5); c.drawImage(CB.img,f.ox,f.oy,f.iw,f.ih); c.fillStyle=lg(c,0,Hc*.55,0,Hc,[[0,"rgba(4,6,26,0)"],[.35,"rgba(4,6,26,.55)"],[1,"rgba(4,6,26,.92)"]]); c.fillRect(0,0,Wc,Hc); c.fillStyle=lg(c,0,0,0,260,[[0,"rgba(4,6,26,.6)"],[1,"rgba(4,6,26,0)"]]); c.fillRect(0,0,Wc,260); }
  for(let i=0;i<10;i++){ const x=80+R()*920, y=Hc*.18+R()*Hc*.25, s=10+R()*14; drawLantern(c,{x,y,s,p:R()*7,mine:false},1); }
  const photo=k.photoUrl?getImg(k.photoUrl):null;
  c.save(); c.translate(Wc/2,Hc*.6); const kk={...k,seed:.4}; c.save(); c.translate(0,45); c.scale(1,-.45); c.translate(0,-45); c.globalAlpha=.25; krStatic(c,kk,150,1); c.restore(); drawGlow(c,kk,150,1); krFull(c,kk,150,1.2,photo); c.restore();
  c.textAlign="center"; c.fillStyle="#ffc861"; c.font='700 92px "Srisakdi","Charm",serif'; c.fillText("ลอยกระทง",Wc/2,140);
  c.fillStyle="#fff3dc"; c.font='600 52px "Bai Jamjuree",sans-serif'; c.fillText(k.partner?`${k.name} ♥ ${k.partner}`:k.name,Wc/2,Hc*.75,Wc-120);
  c.font='400 46px "Charm",serif'; c.fillStyle="#fff6df"; const lines=wrapLines(c,"“"+k.wish+"”",Wc-180).slice(0,3); lines.forEach((ln,i)=>c.fillText(ln,Wc/2,Hc*.81+i*60));
  if(fortune){ c.font='600 30px "Bai Jamjuree",sans-serif'; c.fillStyle="#ff9fc0"; const fl=wrapLines(c,"เซียมซี: "+fortune[1],Wc-200).slice(0,2); fl.forEach((ln,i)=>c.fillText(ln,Wc/2,Hc-80+i*40-(fl.length-1)*40)); }
  let blob=null; try{ blob=await new Promise(r=>cv2.toBlob(r,"image/png")); }catch(e){}
  if(!blob){ toast("สร้างรูปไม่สำเร็จ"); return; }
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="krathong-"+(k.name.replace(/[^\p{L}\p{N}]+/gu,"-").slice(0,24)||"wish")+".png"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("บันทึกการ์ดกระทงแล้ว");
}

/* ================= list drawer ================= */
$("btnList").addEventListener("click",()=>{ const d=$("drawer"); d.hidden=!d.hidden; $("btnList").setAttribute("aria-pressed",String(!d.hidden)); if(!d.hidden) renderList(); });
function renderList(){
  const body=$("listBody"); body.textContent="";
  const real=cachedReal.slice().sort((a,b)=>b.createdAt-a.createdAt);
  if(!real.length){ body.append(el("div","meta","ยังไม่มีใครลอย เป็นคนแรกเลย")); return; }
  for(const k of real.slice(0,80)){ const b=el("button","li"+(mine.has(k.id)?" mine":"")); const pe=photoEl(k); if(pe){ pe.className="li-photo"; pe.loading="lazy"; b.append(pe); } const tx=el("div","li-text"); tx.append(el("b",null,k.partner?k.name+" ♥ "+k.partner:k.name)); tx.append(el("span",null,k.wish)); b.append(tx); b.addEventListener("click",()=>{ highlight=k.id; highlightUntil=performance.now()+6000; openKCard(k); }); body.append(b); }
}

/* ================= server sync ================= */
let dbState="connecting";
function setStatus(){
  const s=$("status");
  if(dbState==="connecting") s.textContent="กำลังเชื่อมต่อแม่น้ำ…";
  else if(dbState==="off") s.textContent="คุณกำลังลอยกระทงในแม่น้ำส่วนตัว · บันทึกการ์ดหรือคัดลอกคำอธิษฐานไปแชร์ให้เพื่อนได้";
  else s.textContent="แม่น้ำนี้แชร์กัน ทุกคนเห็นกระทงของกันและกัน · แตะท้องฟ้าเพื่อปล่อยโคม"+(isOwner?" · โหมดผู้ดูแล":"");
}
async function loadRiver(first){
  try{
    const r=await fetch(API,{cache:"no-store"});
    if(!r.ok) throw 0;
    const j=await r.json();
    const fresh=(j.items||[]).map(d=>sanitize(String(d.id),d));
    // keep the splash flag on items we already show
    const prev=new Map(shared.map(x=>[x.id,x])); for(const x of fresh){ const o=prev.get(x.id); if(o&&o._splashed) x._splashed=true; }
    shared=fresh; apiOK=true; dbState="live";
    const ids=new Set(shared.map(x=>x.id)); localOnly=localOnly.filter(x=>!ids.has(x.id));
  }catch(e){ if(first||!apiOK){ dbState="off"; apiOK=false; } }
  setStatus(); refreshUI();
}
loadRiver(true);
setInterval(()=>{ if(!document.hidden) loadRiver(false); },15000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) loadRiver(false); });

/* ================= boot ================= */
addEventListener("resize",resize);
resize(); refreshUI(); setStatus();
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>spriteCache.clear());
})();
